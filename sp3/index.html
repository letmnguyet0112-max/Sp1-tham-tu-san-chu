<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SP3 – Ngôi nhà chữ cái</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#244c48;background:linear-gradient(#ffd7a8 0 46%,#e9a86c 46% 100%);min-height:100vh;overflow-x:hidden}.world{min-height:100vh;padding:18px;position:relative;overflow:hidden}.cloud{position:fixed;font-size:70px;opacity:.9;animation:cloud 22s linear infinite;z-index:0}.c1{top:7%;left:-10%}.c2{top:18%;left:-20%;animation-delay:-11s;font-size:55px}.sun{position:fixed;right:5%;top:4%;font-size:80px;animation:spin 18s linear infinite}.flowers{position:fixed;bottom:0;left:0;right:0;height:78px;background:repeating-linear-gradient(45deg,#d99058 0 28px,#efbd7f 28px 56px);border-top:6px solid #fff1cf;opacity:.9}.world:before{content:"◆  ●  ◆  ●  ◆  ●  ◆  ●  ◆  ●  ◆";position:fixed;left:0;right:0;top:18px;text-align:center;font-size:28px;letter-spacing:20px;color:#168b8c;text-shadow:0 18px #f05d5e;z-index:1}.card{position:relative;z-index:2;max-width:1120px;margin:auto;background:rgba(255,250,232,.96);border:5px solid #fff2cf;border-radius:36px;box-shadow:0 18px 45px rgba(42,93,70,.25);padding:25px;min-height:690px}.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.pill,.sound{border:0;background:#fff1a9;color:#35563e;border-radius:999px;padding:11px 17px;font-weight:900;box-shadow:0 4px 0 #e7c64f}.sound{cursor:pointer}.progress{height:15px;background:#d7efd0;border-radius:99px;flex:1;overflow:hidden;min-width:170px}.bar{height:100%;background:linear-gradient(90deg,#ffb44c,#64cf83)}h1,h2{text-align:center}.title{font-size:50px;color:#e25d45;margin:12px 0 5px}.subtitle{text-align:center;font-size:22px}.village{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin:24px auto}.house{position:relative;width:210px;height:180px;cursor:pointer;transition:.25s;filter:drop-shadow(0 10px 5px rgba(0,0,0,.15))}.house:hover{transform:translateY(-7px)}.roof{width:0;height:0;border-left:105px solid transparent;border-right:105px solid transparent;border-bottom:75px solid #ef6655;position:absolute;top:0}.home{position:absolute;left:20px;top:70px;width:170px;height:110px;background:#ffd66b;border:5px solid #fff;border-radius:10px}.door{position:absolute;width:64px;height:76px;bottom:0;left:53px;background:#9a653d;border-radius:30px 30px 0 0;display:flex;align-items:center;justify-content:center}.letter{position:static;font-size:52px;font-weight:900;color:#fff;text-shadow:0 3px #6b4228;line-height:1}.house.active{animation:houseGlow .75s ease-in-out 2}.house.active .letter{animation:letterPop .65s ease-in-out 2;color:#fff7a8}.arrive{position:absolute;z-index:5;left:50%;top:104px;font-size:52px;font-weight:900;color:#fff7a8;text-shadow:0 3px #7a4a27;animation:dock 1s cubic-bezier(.2,.8,.2,1) forwards;pointer-events:none}.single-house{display:flex;justify-content:center;margin:25px auto 10px}.hB .roof{border-bottom-color:#168b8c}.hB .home{background:#8fd8cf}.hC .roof{border-bottom-color:#9a67b8}.hC .home{background:#d9b9e8}.character{text-align:center;font-size:100px;animation:bounce 1.5s ease-in-out infinite}.name{text-align:center;font-size:28px;font-weight:900;color:#35563e}.choices{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;margin:25px auto}.choice{border:4px solid #fff;background:#fff;border-radius:25px;padding:16px 25px;font-size:34px;font-weight:900;min-width:150px;cursor:pointer;box-shadow:0 8px 0 #b6d4aa;transition:.2s}.choice:hover{transform:translateY(-4px)}.correct{background:#bdf2c4;border-color:#55ca72;transform:scale(1.12);box-shadow:0 0 0 6px rgba(85,202,114,.18),0 0 24px #74df8d}.wrong{background:#ffd2d2;border-color:#ff8585}.road{height:90px;background:#e8c995;border-radius:50%;margin:12px auto;max-width:800px;position:relative;border:5px dashed #fff}.traveler{position:absolute;left:5%;top:-25px;font-size:80px}.go-home{animation:goHome 1.3s cubic-bezier(.2,.7,.3,1) forwards}.lit{animation:glow 1s ease-in-out infinite alternate}.feedback{max-width:760px;margin:15px auto;padding:16px;border-radius:20px;text-align:center;font-size:24px;font-weight:900;background:#e4f8df;border:3px solid #68cf80}.next,.start{border:0;border-radius:22px;background:#ffcf55;color:#61420c;font-size:24px;font-weight:900;padding:17px 27px;box-shadow:0 7px 0 #d89d2c;cursor:pointer}.center{text-align:center}.scene{padding-top:10px}.object-grid{display:flex;justify-content:center;gap:20px;flex-wrap:wrap}.obj{font-size:72px;background:#fff;border:4px solid #cde8b8;border-radius:24px;padding:14px 24px;cursor:pointer}.physical{max-width:780px;margin:25px auto;background:#e9f8ff;border:4px dashed #55add6;border-radius:26px;padding:22px;text-align:center;font-size:21px}.intro-icons{text-align:center;font-size:58px;letter-spacing:14px;margin:20px auto 8px;animation:party 1.2s ease-in-out infinite alternate}.target-letter{display:inline-block;font-size:1.55em;line-height:.8;color:#e45c45;font-weight:1000;text-shadow:0 3px #ffe0a8}.target-letter.b{color:#078c8d}.choice.correct{font-size:52px}.obj.correct{transform:scale(1.1);box-shadow:0 0 0 7px rgba(85,202,114,.2),0 0 28px #66d983;background:#c9f7cf;border-color:#4dcc70}.house.answer-b .letter{font-size:72px;color:#fff59a;animation:letterPop .65s ease-in-out 2}.match-card{position:relative;overflow:visible}.drop-letter{position:absolute;z-index:20;left:50%;bottom:-4px;font-size:58px;font-weight:1000;color:#ff704d;text-shadow:0 3px #fff;pointer-events:none;animation:dropToHouse 1.15s cubic-bezier(.25,.8,.25,1) forwards}.drop-letter.b{color:#078c8d}.drop-letter.c{color:#9560ba}@keyframes dropToHouse{0%{transform:translate(-50%,0) scale(1.25);opacity:1}70%{transform:translate(-50%,225px) scale(1.45);opacity:1}100%{transform:translate(-50%,285px) scale(.85);opacity:0}}.final{text-align:center}.finalVillage{font-size:78px;animation:party 1.2s ease-in-out infinite alternate}.lantern{display:inline-block;font-size:48px;animation:lantern .8s ease-in-out infinite alternate}.stars{position:fixed;pointer-events:none;z-index:10;font-size:25px;animation:rise 3s linear infinite}@keyframes cloud{to{transform:translateX(125vw)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes bounce{50%{transform:translateY(-12px) rotate(3deg)}}@keyframes goHome{0%{left:5%;transform:scale(1)}60%{left:70%;transform:translateY(-25px) scale(1.1)}100%{left:83%;transform:translateY(-70px) scale(.65);opacity:.15}}@keyframes glow{to{filter:drop-shadow(0 0 20px #ffe642);transform:scale(1.05)}}@keyframes houseGlow{50%{filter:drop-shadow(0 0 24px #fff06a);transform:translateY(-8px) scale(1.05)}}@keyframes letterPop{50%{transform:scale(1.45) translateY(-5px)}}@keyframes dock{0%{transform:translate(-50%,210px) scale(1.35);opacity:.25}65%{transform:translate(-50%,8px) scale(1.15);opacity:1}100%{transform:translate(-50%,0) scale(1);opacity:0}}@keyframes party{to{transform:translateY(-8px) scale(1.03)}}@keyframes lantern{to{transform:translateY(-8px)}}@keyframes rise{from{transform:translateY(105vh) rotate(0);opacity:0}20%{opacity:1}to{transform:translateY(-10vh) rotate(360deg);opacity:0}}@media(max-width:700px){.card{padding:14px;min-height:94vh}.title{font-size:36px}.house{transform:scale(.82);margin:-12px}.character{font-size:78px}.choice{font-size:28px;min-width:110px}}
</style></head><body><div class="world"><div class="cloud c1">☁️</div><div class="cloud c2">☁️</div><div class="sun">☀️</div><div class="flowers"></div><main class="card" id="root"></main></div><script>
const A={intro:'audio/intro.mp3',t1:'audio/task1.mp3',t2:'audio/task2.mp3',t3:'audio/task3.mp3',t4:'audio/task4.mp3',t5:'audio/task5.mp3',t6:'audio/task6.mp3',t7:'audio/task7.mp3',t8:'audio/task8.mp3',m:'audio/correct-m.mp3',b:'audio/correct-b.mp3',c:'audio/correct-c.mp3',mu:'audio/correct-mu.mp3',odd:'audio/correct-odd.mp3',doll:'audio/correct-doll.mp3',finish:'audio/finish.mp3',home:'audio/home.mp3',finale:'audio/finale.mp3'};
let screen=0,ans=-1,ok=false,audio=null,music=true,ctx=null,timer=null,note=0,matches={},lastMatch=null;
const melody=[783.99,987.77,1174.66,987.77,880,1046.5,1318.51,1046.5,987.77,1174.66,1396.91,1174.66,880,987.77,1046.5,783.99];const bass=[261.63,329.63,293.66,392.00];
function startMusic(){if(!music)return;if(!ctx){ctx=new(window.AudioContext||window.webkitAudioContext)();ctx.g=ctx.createGain();ctx.g.gain.value=.38;ctx.g.connect(ctx.destination)}if(ctx.state==='suspended')ctx.resume();if(!timer){tick();timer=setInterval(tick,285)}}
function tick(){if(!ctx||!music)return;const t=ctx.currentTime,i=note++,o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=melody[i%melody.length];g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.028,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+.16);o.connect(g);g.connect(ctx.g);o.start(t);o.stop(t+.18);if(i%2===0){const b=ctx.createOscillator(),bg=ctx.createGain();b.type='sine';b.frequency.value=bass[Math.floor(i/4)%bass.length];bg.gain.setValueAtTime(.0001,t);bg.gain.exponentialRampToValueAtTime(.014,t+.01);bg.gain.exponentialRampToValueAtTime(.0001,t+.12);b.connect(bg);bg.connect(ctx.g);b.start(t);b.stop(t+.14)}if(i%4===3){const ch=ctx.createOscillator(),cg=ctx.createGain();ch.type='sine';ch.frequency.value=melody[(i+4)%melody.length]*1.5;cg.gain.setValueAtTime(.0001,t);cg.gain.exponentialRampToValueAtTime(.009,t+.005);cg.gain.exponentialRampToValueAtTime(.0001,t+.08);ch.connect(cg);cg.connect(ctx.g);ch.start(t);ch.stop(t+.09)}}
function play(k,next){if(audio){audio.pause()}if(ctx?.g)ctx.g.gain.setTargetAtTime(.09,ctx.currentTime,.05);const a=new Audio(A[k]);audio=a;const end=()=>{audio=null;if(ctx?.g)ctx.g.gain.setTargetAtTime(.38,ctx.currentTime,.08);next&&next()};a.onended=end;a.onerror=end;a.play().catch(end)}
function topbar(){return '<div class="top"><span class="pill">🏡 Nhiệm vụ '+screen+'/8</span><div class="progress"><div class="bar" style="width:'+(screen/8*100)+'%"></div></div><button class="sound" onclick="play(\'t'+screen+'\')">🔊 Nghe lại</button><button class="sound" onclick="music=!music;if(music)startMusic();else{clearInterval(timer);timer=null;ctx&&ctx.suspend()}">🎵 Nhạc làng vui</button></div>'}
function house(l,cl='',active=false){return '<div class="house '+cl+(active?' active':'')+'"><div class="roof"></div><div class="home"><div class="door"><span class="letter">'+l+'</span></div></div>'+(active?'<span class="arrive">'+l+'</span>':'')+'</div>'}
function houses(target=''){return '<div class="village">'+house('m','',target==='m'||target==='all')+house('b','hB',target==='b'||target==='all')+house('c','hC',target==='c'||target==='all')+'</div>'}
function oneHouse(l,cl='',active=false){return '<div class="single-house">'+house(l,cl,active)+'</div>'}
function choose(i,right,voice){ans=i;ok=i===right;render();if(ok)play('home',()=>play(voice));else speakRetry()}
function speakRetry(){if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('Con nhìn lại thật kỹ và thử một lần nữa nhé!');u.lang='vi-VN';u.rate=.9;speechSynthesis.speak(u)}}
function feedback(){return ans<0?'':ok?'<div class="feedback">🌟 Chính xác! Bạn nhỏ đã tìm đúng nhà!</div><div class="center"><button class="next" onclick="next()">ĐI TIẾP TRONG LÀNG ➜</button></div>':'<div class="feedback" style="background:#fff0f0;border-color:#ff9292">🌱 Chưa đúng rồi. Con thử lại nhé!</div>'}
function opts(arr,right,voice){return '<div class="choices">'+arr.map((x,i)=>'<button class="choice '+(ans===i?(ok?'correct':'wrong'):'')+'" onclick="choose('+i+','+right+',\''+voice+'\')">'+x+'</button>').join('')+'</div>'}
function next(){ans=-1;ok=false;matches={};lastMatch=null;screen++;render();if(screen<=8)setTimeout(()=>play('t'+screen),250);else play('finish',()=>play('finale'))}
function match(obj,home){matches[obj]=home;lastMatch=obj;const right={cat:'m',ball:'b',fish:'c'}[obj];if(home===right){play('home')}else{speakRetry()}if(matches.cat==='m'&&matches.ball==='b'&&matches.fish==='c')ok=true;render()}
function render(){let h='';
if(screen===0)h='<div class="intro-icons">🏡 🌳 🏠 🌼 🏡</div><h1 class="title">NGÔI NHÀ CHỮ CÁI</h1><p class="subtitle">Cùng giúp các bạn nhỏ tìm đường về nhà!</p>'+houses()+'<div class="center"><button class="start" onclick="startMusic();play(\'intro\',()=>{screen=1;render();play(\'t1\')})">VÀO NGÔI LÀNG 🌈</button></div>';
else if(screen===1)h=topbar()+'<div class="scene"><div class="character">🐱</div><div class="name"><b class="target-letter">m</b>èo</div>'+houses(ok?'m':'')+opts(['m','b','c'],0,'m')+feedback()+'</div>';
else if(screen===2)h=topbar()+'<div class="scene"><div class="character">⚽</div><div class="name"><b class="target-letter b">b</b>óng</div>'+houses(ok?'b':'')+opts(['c','b','m'],1,'b')+feedback()+'</div>';
else if(screen===3)h=topbar()+'<div class="scene"><div class="character">🐟</div><div class="name"><b class="target-letter" style="color:#9560ba">c</b>á</div>'+houses(ok?'c':'')+opts(['m','c','b'],1,'c')+feedback()+'</div>';
else if(screen===4)h=topbar()+'<div class="scene"><div class="character">🧢</div><div class="name"><b class="target-letter">m</b>ũ</div>'+houses(ok?'m':'')+opts(['b','c','m'],2,'mu')+feedback()+'</div>';
else if(screen===5)h=topbar()+'<div class="scene"><h2>AI ĐI NHẦM NHÀ <span class="target-letter">m</span>?</h2><div class="object-grid">'+['🐱 mèo','🧢 mũ','⚽ bóng'].map((x,i)=>'<button class="obj '+(ans===i?(ok?'correct':'wrong'):'')+'" onclick="choose('+i+',2,\'odd\')">'+x+'</button>').join('')+'</div>'+oneHouse('m','',false)+feedback()+'</div>';
else if(screen===6)h=topbar()+'<div class="scene"><h2>AI LÀ BẠN CỦA NHÀ <span class="target-letter b">b</span>?</h2>'+oneHouse('b','hB'+(ok?' answer-b':''),ok)+'<div class="object-grid">'+['🧸 búp bê','🐟 cá','🧢 mũ'].map((x,i)=>'<button class="obj '+(ans===i?(ok?'correct':'wrong'):'')+'" onclick="choose('+i+',0,\'doll\')">'+x+'</button>').join('')+'</div>'+feedback()+'</div>';
else if(screen===7){const done=Object.keys(matches).length===3;h=topbar()+'<div class="scene"><h2>GHÉP BA BẠN VỚI ĐÚNG NHÀ</h2><p class="subtitle">Chọn một nhà cho từng bạn.</p><div class="object-grid">'+[['cat','🐱 mèo'],['ball','⚽ bóng'],['fish','🐟 cá']].map(([k,x])=>{const right={cat:'m',ball:'b',fish:'c'}[k],good=matches[k]===right;return '<div class="physical match-card" style="margin:5px;padding:12px"><b>'+x+'</b><div>'+['m','b','c'].map(v=>'<button class="choice '+(matches[k]===v?(good?'correct':'wrong'):'')+'" style="min-width:70px;padding:8px;margin:5px" onclick="match(\''+k+'\',\''+v+'\')">'+v+'</button>').join('')+'</div>'+(good&&lastMatch===k?'<span class="drop-letter '+right+'">'+right+'</span>':good?'<small>✓ Đã về đúng nhà</small>':'<small>Con chọn một chữ nhé</small>')+'</div>'}).join('')+'</div>'+houses(lastMatch&&matches[lastMatch]===({cat:'m',ball:'b',fish:'c'}[lastMatch])?matches[lastMatch]:'')+(ok?'<div class="feedback">🎉 Mèo → m &nbsp; • &nbsp; Bóng → b &nbsp; • &nbsp; Cá → c</div><div class="center"><button class="next" onclick="next()">NHIỆM VỤ CUỐI ➜</button></div>':done?'<div class="feedback" style="background:#fff0f0">Có bạn đang nhầm nhà. Con thử ghép lại nhé!</div>':'')+'</div>'}
else if(screen===8)h=topbar()+'<div class="scene"><h2>NGÔI LÀNG NGOÀI MÀN HÌNH</h2><div class="physical"><div style="font-size:65px">🃏 🏡 👧 🏃‍♂️</div><p>Cô đặt các <b>thẻ chữ m – b – c</b> thành ba ngôi nhà.</p><p>Con chọn đồ vật/thẻ tranh thật rồi <b>mang hoặc chạy về đúng nhà</b>.</p><p>Hãy nói tên đồ vật và chữ cái đầu trước khi đặt vào nhà nhé!</p></div><div class="center"><button class="next" onclick="ok=true;render();play(\'home\')">CON ĐÃ XẾP ĐÚNG! ⭐</button></div>'+(ok?'<div class="feedback">🌈 Tuyệt vời! Con đã hoàn thành thử thách ngoài màn hình.</div><div class="center"><button class="next" onclick="next()">HOÀN THÀNH 🏡</button></div>':'')+'</div>';
else{const s=Array.from({length:28},(_,i)=>'<i class="stars" style="left:'+((i*41)%100)+'%;animation-delay:-'+((i%8)*.35)+'s">'+(i%2?'🌼':'⭐')+'</i>').join('');h='<div class="final">'+s+'<div class="finalVillage">🏠✨🏡✨🏠</div><h1 class="title">NGÔI LÀNG CHỮ CÁI ĐÃ ĐỦ BẠN!</h1><p class="subtitle">Mỗi bạn đều đã tìm được đúng ngôi nhà của mình.</p><div><span class="lantern">🎈</span> <span class="lantern">🎉</span> <span class="lantern">🎈</span></div><button class="start" onclick="screen=0;render()">🔁 CHƠI LẠI</button></div>'}
document.getElementById('root').innerHTML=h}
render();
</script></body></html>
