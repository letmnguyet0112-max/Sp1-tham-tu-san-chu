<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SP6 – Kho báu chữ viết</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Trebuchet MS",Arial,sans-serif;color:#3b2c1c}button{font:inherit}
body{background:#0a7185;overflow-x:hidden}.world{min-height:100vh;position:relative;overflow:hidden;padding:16px 14px 78px;background:linear-gradient(#56c9e7 0 45%,#0d94aa 45% 66%,#e6bd6a 66% 100%)}
.sun{position:fixed;left:7%;top:48px;width:90px;height:90px;border-radius:50%;background:#ffd65a;box-shadow:0 0 0 20px #ffe98955;z-index:0}.cloud{position:fixed;background:#fff;border-radius:50px;opacity:.85;z-index:0}.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}.cloud:before{width:62px;height:62px;left:25px;top:-29px}.cloud:after{width:82px;height:82px;right:23px;top:-40px}.c1{width:170px;height:50px;left:24%;top:92px}.c2{width:205px;height:58px;right:8%;top:118px}
.island{position:fixed;z-index:0;bottom:120px;width:360px;height:165px;border-radius:50% 50% 38% 38%;background:#4fbd68;border-bottom:35px solid #c79852;box-shadow:0 18px 0 #97693f}.i1{left:-80px;transform:rotate(3deg)}.i2{right:-85px;transform:rotate(-4deg)}.palm{position:fixed;z-index:1;font-size:120px;bottom:188px}.p1{left:2%}.p2{right:3%;transform:scaleX(-1)}
.wave{position:fixed;left:0;right:0;top:46%;height:95px;z-index:0;background:repeating-radial-gradient(ellipse at 50% 100%,transparent 0 22px,#ffffff44 23px 27px,transparent 28px 52px);opacity:.7}
.wrap{max-width:1180px;margin:auto;position:relative;z-index:4}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{background:#704225;color:#fff7d2;border:4px solid #e6b84b;border-radius:25px;padding:9px 18px;font-weight:1000;box-shadow:0 5px 0 #472716;letter-spacing:.5px}.controls{display:flex;gap:9px}.round{width:57px;height:57px;border:4px solid #fff0ad;border-radius:50%;background:#ffd45b;box-shadow:0 5px 0 #bb7b1e;font-size:24px;cursor:pointer}
.map{max-width:1030px;margin:13px auto 15px;padding:11px 16px;background:#f4d990;border:5px solid #8d572f;border-radius:22px;box-shadow:0 7px 0 #5d3923;display:flex;align-items:center;gap:12px;position:relative}.map:before,.map:after{content:"";position:absolute;top:4px;bottom:4px;width:16px;border-radius:50%;background:#d6ad61;border:3px solid #8d572f}.map:before{left:-12px}.map:after{right:-12px}.path{display:flex;align-items:center;justify-content:space-between;flex:1;gap:5px}.dot{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:#fff3c6;border:3px dashed #a46a38;font-weight:1000;color:#865128}.dot.done{background:#ffd34f;border-style:solid;border-color:#d1871d;box-shadow:0 0 14px #ffd64c}.dot.now{transform:scale(1.22);background:#fff;border-color:#e7503d}.keys{min-width:116px;text-align:center;font-weight:1000;color:#5b321d}.keyIcon{display:inline-block;font-size:24px;margin-left:2px;filter:drop-shadow(0 2px #8b5d18)}
.scene{max-width:1030px;min-height:505px;margin:auto;padding:28px 30px 32px;text-align:center;background:linear-gradient(135deg,rgba(255,248,214,.97),rgba(246,222,162,.97));border:10px solid #8c5a31;border-radius:34px;box-shadow:0 12px 0 #5d3822,0 22px 40px #143f4855;position:relative}.scene:before{content:"";position:absolute;inset:10px;border:3px dashed #c08b45;border-radius:21px;pointer-events:none}.scene>*{position:relative;z-index:2}
.question{font-size:31px;font-weight:1000;color:#57381f;margin:17px auto 18px;max-width:850px}.focus{font-family:"Arial Black",Arial,sans-serif;color:#d94435;font-size:1.1em}.picture{font-size:102px;line-height:1.05;margin:7px}.word{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:10px 20px;border-radius:18px;background:#fff7c9;border:4px solid #d9a83c;box-shadow:0 6px 0 #ae7628;font:900 38px "Arial Black",Arial;color:#28231c}
.choices{display:flex;justify-content:center;gap:19px;flex-wrap:wrap;margin:25px auto 12px}.choice{min-width:125px;min-height:82px;padding:13px 20px;background:#fff;border:5px solid #c69b62;border-radius:20px;box-shadow:0 8px 0 #946b3e;font:900 35px "Arial Black",Arial;color:#161616;cursor:pointer;transition:.18s}.choice:hover{transform:translateY(-4px)}.choice.correct{background:#d8f3c9;border-color:#56ad55;box-shadow:0 0 22px #7edc73;transform:scale(1.06)}.choice.wrong{background:#ffd9d0;border-color:#d96b5d;animation:shake .3s}.picChoice{min-width:190px}.picChoice .emoji{display:block;font-size:60px}.picChoice small{display:block;font-size:24px;margin-top:5px}
.feedback{max-width:750px;margin:20px auto 8px;padding:13px 17px;background:#e3f5d8;border:3px solid #68ae58;border-radius:18px;font-size:21px;font-weight:900}.next{position:relative;min-width:280px;margin-top:13px;padding:16px 32px;border:4px solid #fff0a1;border-radius:26px;background:linear-gradient(#ffe36c,#ffb72d);box-shadow:0 7px 0 #b76a17,0 0 0 2px #e29420;color:#2b1a0b;font:900 25px "Arial Black",Arial;cursor:pointer}.next:before,.next:after{content:"✦";position:absolute;top:50%;transform:translateY(-50%);font-size:31px;color:#ffd84c;text-shadow:-15px 10px #fff0a1}.next:before{left:-43px}.next:after{right:-43px}
.introMap{font-size:91px;margin:7px}.title{font-size:43px;color:#8b4b27;margin:12px 0 7px;text-shadow:0 2px #fff4c5}.subtitle{font-size:22px;font-weight:800;max-width:760px;margin:8px auto 18px;color:#725137}.treasureRow{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin:18px}.mini{background:#fff2ba;border:4px solid #b57833;border-radius:17px;padding:10px 15px;font-size:21px;font-weight:900}
.letterLine{display:flex;justify-content:center;gap:17px;margin:24px;flex-wrap:wrap}.letterStone{width:85px;height:84px;border-radius:50% 50% 44% 44%;display:grid;place-items:center;background:#d8c09b;border:6px solid #856b4f;box-shadow:0 7px 0 #66503d;font:900 35px "Arial Black",Arial;cursor:pointer}.letterStone:hover{transform:translateY(-3px)}.seq{font:900 39px "Arial Black";letter-spacing:14px;background:#fff4c8;border:4px dashed #aa7339;border-radius:19px;padding:16px 20px;display:inline-block;margin:13px}
.matchArea{display:grid;grid-template-columns:1fr 1fr;gap:28px;max-width:680px;margin:24px auto}.matchCol{display:flex;flex-direction:column;gap:13px}.matchBtn{min-height:68px;border:4px solid #9c6a3d;border-radius:17px;background:#fff7d7;box-shadow:0 5px 0 #735033;font:900 28px "Arial Black";cursor:pointer}.matchBtn.selected{background:#ffd252;border-color:#d78b1e;transform:scale(1.04)}.matchBtn.matched{background:#d9f2c8;border-color:#62aa52;opacity:.72}.matchBtn.wordBtn{font-size:23px}.physical{max-width:790px;margin:18px auto;padding:19px;background:#fff5c9;border:4px dashed #9b6637;border-radius:24px;font-size:21px;font-weight:800}.hunt{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:17px}.huntCard{width:91px;height:95px;border-radius:16px;background:#fff;border:5px solid #d54d3f;box-shadow:0 6px 0 #9e342b;display:grid;place-items:center;font:900 38px "Arial Black"}.huntCard:nth-child(2){border-color:#3c9c84;box-shadow:0 6px 0 #26705e}.huntCard:nth-child(3){border-color:#e1a229;box-shadow:0 6px 0 #a66e11}
.chest{font-size:118px;margin:4px;filter:drop-shadow(0 9px 5px #5d392866)}.chest.closed{animation:wobble 1.5s infinite}.chest.open{animation:chestOpen .8s ease-out}.gold{font-size:55px;animation:glow 1s infinite alternate}.final h1{font-size:43px;color:#8c4b25;margin:5px}.keyFly{position:fixed;z-index:9999;font-size:48px;pointer-events:none;filter:drop-shadow(0 4px 2px #6b431c55)}
.confetti{position:fixed;top:-35px;z-index:30;font-size:27px;animation:fall 3.5s linear forwards}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}@keyframes wobble{50%{transform:rotate(3deg) scale(1.02)}}@keyframes chestOpen{0%{transform:scale(.75) rotate(-4deg)}70%{transform:scale(1.12) rotate(3deg)}100%{transform:scale(1)}}@keyframes glow{to{filter:drop-shadow(0 0 16px #fff36d)}}@keyframes fall{to{transform:translateY(110vh) rotate(520deg)}}
@media(max-width:700px){.scene{padding:24px 12px}.question{font-size:25px}.title{font-size:34px}.choice{min-width:100px}.matchArea{gap:12px}.map{padding:8px}.dot{width:27px;height:27px;font-size:13px}.keys{min-width:80px}.brand{font-size:14px}.next{min-width:225px;font-size:20px}.palm{opacity:.5}}
</style></head><body>
<div class="world"><div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="wave"></div><div class="island i1"></div><div class="island i2"></div><div class="palm p1">🌴</div><div class="palm p2">🌴</div><main class="wrap" id="app"></main></div>
<script>
let screen=0,answered=false,music=true,voiceOn=true,ctx=null,timer=null,voiceAudio=null,matchLetter=null,matched=[];
const VOICE={intro:"audio/intro.mp3",t1:"audio/t1.mp3",t2:"audio/t2.mp3",t3:"audio/t3.mp3",t4:"audio/t4.mp3",t5:"audio/t5.mp3",t6:"audio/t6.mp3",t7:"audio/t7.mp3",t8:"audio/t8.mp3",correct:"audio/correct.mp3",retry:"audio/retry.mp3",finish:"audio/finish.mp3"};
function audioInit(){if(ctx)return;ctx=new (window.AudioContext||window.webkitAudioContext)();ctx.master=ctx.createGain();ctx.master.gain.value=.25;ctx.master.connect(ctx.destination)}
function tone(f,d=.13,type='sine',vol=.05,delay=0){if(!ctx||!music)return;const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+delay;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ctx.master);o.start(t);o.stop(t+d+.03)}
function islandBeat(){if(!ctx||!music)return;[220,330,294,392,330].forEach((f,i)=>tone(f,.11,'triangle',.025,i*.17));tone(110,.08,'sine',.018,0);tone(110,.08,'sine',.018,.34)}
function startMusic(){audioInit();if(ctx.state==='suspended')ctx.resume();if(!timer){islandBeat();timer=setInterval(islandBeat,1650)}}
function duck(v){if(ctx&&ctx.master)ctx.master.gain.setTargetAtTime(music?v:.0001,ctx.currentTime,.08)}
function playVoice(k){if(!voiceOn||!VOICE[k])return;if(voiceAudio){voiceAudio.pause();voiceAudio.currentTime=0}voiceAudio=new Audio(VOICE[k]);duck(.05);const restore=()=>duck(.25);voiceAudio.onended=restore;voiceAudio.onerror=restore;voiceAudio.play().catch(restore)}
function sparkle(){audioInit();[659,784,988,1318].forEach((f,i)=>tone(f,.16,'sine',.08,i*.08))}
function softWrong(){audioInit();tone(230,.18,'triangle',.05)}
function toggleMusic(){music=!music;startMusic();duck(music?.25:.0001);render()}
function toggleVoice(){voiceOn=!voiceOn;if(!voiceOn&&voiceAudio){voiceAudio.pause();voiceAudio.currentTime=0}render()}
function mapHtml(){let dots='';for(let i=1;i<=8;i++)dots+='<div class="dot '+(i<screen?'done':i===screen?'now':'')+'">'+(i<screen?'✓':i)+'</div>';let ks='';for(let i=1;i<screen&&i<=8;i++)ks+='<span class="keyIcon">🔑</span>';return '<div class="map"><div class="path">'+dots+'</div><div class="keys">'+ks+' '+Math.max(0,screen-1)+'/8</div></div>'}
function head(){return '<div class="top"><div class="brand">🏝️ KHO BÁU CHỮ VIẾT</div><div class="controls"><button class="round" onclick="toggleVoice()">'+(voiceOn?'👩‍🏫':'🔇')+'</button><button class="round" onclick="toggleMusic()">'+(music?'🪘':'🔕')+'</button></div></div>'+mapHtml()}
function choice(label,ok,extra=''){return '<button class="choice '+extra+'" onclick="answer(this,'+ok+')">'+label+'</button>'}
function feedback(){return answered?'<div class="feedback">🔑 Chính xác! Con đã tìm được một chìa khóa kho báu.</div><button class="next" onclick="next()">ĐI TIẾP →</button>':''}
function flyKey(el){const from=el.getBoundingClientRect(),target=document.querySelector('.keys').getBoundingClientRect(),k=document.createElement('div');k.className='keyFly';k.textContent='🔑';k.style.left=(from.left+from.width/2-20)+'px';k.style.top=(from.top+10)+'px';document.body.appendChild(k);k.animate([{transform:'translate(0,0) scale(1)'},{transform:'translate('+(target.left-from.left)+'px,'+(target.top-from.top)+'px) scale(.65) rotate(25deg)'}],{duration:720,easing:'cubic-bezier(.2,.8,.25,1)',fill:'forwards'}).onfinish=()=>k.remove()}
function answer(el,ok){if(answered)return;if(ok){answered=true;el.classList.add('correct');flyKey(el);sparkle();setTimeout(()=>playVoice('correct'),180);setTimeout(render,800)}else{el.classList.add('wrong');softWrong();playVoice('retry');setTimeout(()=>el.classList.remove('wrong'),500)}}
function start(){startMusic();sparkle();screen=1;answered=false;render();setTimeout(()=>playVoice('t1'),450)}
function next(){screen++;answered=false;matchLetter=null;matched=[];render();if(screen<=8)setTimeout(()=>playVoice('t'+screen),420);else{sparkle();celebrate();setTimeout(()=>playVoice('finish'),350)}}
function selectMatch(type,val,el){if(answered)return;if(type==='letter'){matchLetter=val;document.querySelectorAll('.matchBtn.letterBtn').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');return}if(!matchLetter){softWrong();playVoice('retry');return}const correct={M:'MÈO',B:'BÓNG',C:'CÁ'}[matchLetter];if(val===correct){matched.push(matchLetter);document.querySelector('[data-letter="'+matchLetter+'"]').classList.add('matched');el.classList.add('matched');sparkle();matchLetter=null;document.querySelectorAll('.matchBtn.letterBtn').forEach(x=>x.classList.remove('selected'));if(matched.length===3){answered=true;setTimeout(()=>playVoice('correct'),150);setTimeout(render,700)}}else{el.classList.add('wrong');softWrong();playVoice('retry');setTimeout(()=>el.classList.remove('wrong'),500)}}
function physicalDone(el){if(answered)return;answered=true;flyKey(el);sparkle();setTimeout(()=>playVoice('correct'),150);setTimeout(render,750)}
function celebrate(){for(let i=0;i<34;i++){setTimeout(()=>{const d=document.createElement('div');d.className='confetti';d.textContent=['✨','⭐','💎','🪙','🎉'][i%5];d.style.left=(3+Math.random()*94)+'%';d.style.animationDuration=(2.5+Math.random()*2)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),5000)},i*60)}}
function render(){let h=head();
if(screen===0)h+='<section class="scene"><div class="introMap">🗺️🏝️</div><h1 class="title">KHO BÁU CHỮ VIẾT</h1><div class="subtitle">Vượt qua 8 thử thách • Thu thập 8 chìa khóa • Mở rương kho báu bí mật!</div><div class="treasureRow"><div class="mini">🧭 BẢN ĐỒ</div><div class="mini">🔑 CHÌA KHÓA</div><div class="mini">💎 KHO BÁU</div></div><div class="chest closed">🔒🧰</div><button class="next" onclick="start()">BẮT ĐẦU THÁM HIỂM!</button></section>';
if(screen===1)h+='<section class="scene"><div class="question">Từ <span class="focus">MŨ</span> bắt đầu bằng chữ gì?</div><div class="picture">🧢</div><div class="word">MŨ</div><div class="choices">'+choice('M',true)+choice('Ũ',false)+choice('B',false)+'</div>'+feedback()+'</section>';
if(screen===2)h+='<section class="scene"><div class="question">Từ nào có chữ <span class="focus">A</span>?</div><div class="choices">'+choice('<span class="emoji">🐟</span><small>CÁ</small>',true,'picChoice')+choice('<span class="emoji">🧢</span><small>MŨ</small>',false,'picChoice')+choice('<span class="emoji">🐱</span><small>MÈO</small>',false,'picChoice')+'</div>'+feedback()+'</section>';
if(screen===3)h+='<section class="scene"><div class="question">Chữ nào khác với các chữ còn lại?</div><div class="letterLine"><button class="letterStone" onclick="answer(this,false)">O</button><button class="letterStone" onclick="answer(this,false)">O</button><button class="letterStone" onclick="answer(this,true)">Ô</button><button class="letterStone" onclick="answer(this,false)">O</button></div>'+feedback()+'</section>';
if(screen===4)h+='<section class="scene"><div class="question">Chữ nào còn thiếu trong dãy chữ?</div><div class="seq">A Ă ? E</div><div class="choices">'+choice('Â',true)+choice('O',false)+choice('Ê',false)+'</div>'+feedback()+'</section>';
if(screen===5)h+='<section class="scene"><div class="question">Từ nào bắt đầu bằng chữ <span class="focus">B</span>?</div><div class="choices">'+choice('<span class="emoji">⚽</span><small>BÓNG</small>',true,'picChoice')+choice('<span class="emoji">🐱</span><small>MÈO</small>',false,'picChoice')+choice('<span class="emoji">🐟</span><small>CÁ</small>',false,'picChoice')+'</div>'+feedback()+'</section>';
if(screen===6)h+='<section class="scene"><div class="question">Có bao nhiêu chữ <span class="focus">M</span> trong dãy chữ?</div><div class="seq">M A M N M</div><div class="choices">'+choice('2',false)+choice('3',true)+choice('4',false)+'</div>'+feedback()+'</section>';
if(screen===7)h+='<section class="scene"><div class="question">Ghép thẻ chữ với từ có chữ bắt đầu tương ứng.</div><div class="matchArea"><div class="matchCol"><button class="matchBtn letterBtn" data-letter="M" onclick="selectMatch(\'letter\',\'M\',this)">M</button><button class="matchBtn letterBtn" data-letter="B" onclick="selectMatch(\'letter\',\'B\',this)">B</button><button class="matchBtn letterBtn" data-letter="C" onclick="selectMatch(\'letter\',\'C\',this)">C</button></div><div class="matchCol"><button class="matchBtn wordBtn" onclick="selectMatch(\'word\',\'CÁ\',this)">🐟 CÁ</button><button class="matchBtn wordBtn" onclick="selectMatch(\'word\',\'MÈO\',this)">🐱 MÈO</button><button class="matchBtn wordBtn" onclick="selectMatch(\'word\',\'BÓNG\',this)">⚽ BÓNG</button></div></div>'+feedback()+'</section>';
if(screen===8)h+='<section class="scene"><div class="question">SĂN KHO BÁU TRONG LỚP 🧭</div><div class="physical">Cô giấu 3 thẻ chữ trong lớp. Bé đi tìm và đặt từng thẻ cạnh hình phù hợp.<div class="hunt"><div class="huntCard">M</div><div class="huntCard">B</div><div class="huntCard">C</div></div><b>M → MÈO 🐱 &nbsp; • &nbsp; B → BÓNG ⚽ &nbsp; • &nbsp; C → CÁ 🐟</b><br><br>Hoạt động này giúp trẻ rời màn hình, vận động và nhận diện chữ trong không gian thật.</div>'+(answered?feedback():'<button class="next" onclick="physicalDone(this)">BÉ ĐÃ TÌM ĐỦ 3 THẺ ✓</button>')+'</section>';
if(screen===9)h+='<section class="scene final"><div class="chest open">🧰✨</div><div class="gold">🪙 💎 🪙 💎 🪙</div><h1>MỞ RƯƠNG KHO BÁU!</h1><div class="subtitle">Xuất sắc! Con đã thu thập đủ 8 chìa khóa và hoàn thành Kho báu chữ viết.</div><div style="font-size:52px;margin:17px">🏆 ⭐ 🌈 ⭐ 🏆</div><button class="next" onclick="screen=0;answered=false;matched=[];render();playVoice(\'intro\')">CHƠI LẠI ↻</button></section>';
document.getElementById('app').innerHTML=h}
render();setTimeout(()=>playVoice('intro'),650);
</script></body></html>
