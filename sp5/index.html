<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SP5 – Chuyến tàu chữ cái</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Trebuchet MS",Arial,sans-serif;color:#173f59}button{font:inherit}
body{overflow-x:hidden;background:#8edcff}
.world{min-height:100vh;position:relative;padding:18px 14px 85px;overflow:hidden;background:
linear-gradient(#8edcff 0 58%,#8bcf72 58% 73%,#e9c27d 73% 100%)}
.cloud{position:fixed;background:#fff;border-radius:60px;opacity:.9;filter:drop-shadow(0 6px 5px #5fa6c630);z-index:0}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}.cloud:before{width:70px;height:70px;left:28px;top:-32px}.cloud:after{width:95px;height:95px;right:25px;top:-48px}
.c1{width:190px;height:58px;left:5%;top:95px}.c2{width:230px;height:68px;right:4%;top:150px}.c3{width:150px;height:48px;left:35%;top:40px;transform:scale(.75)}
.hill{position:fixed;bottom:180px;width:430px;height:190px;border-radius:50% 50% 0 0;background:#69b95f;z-index:0}.h1{left:-90px}.h2{right:-80px;background:#75c667}.sun{position:fixed;right:9%;top:45px;width:92px;height:92px;border-radius:50%;background:#ffd958;box-shadow:0 0 0 18px #ffe98b55;z-index:0}
.station{position:fixed;right:5%;bottom:172px;width:185px;height:155px;background:#fff1c8;border:8px solid #cf7648;border-radius:18px 18px 4px 4px;z-index:0;box-shadow:0 10px 18px #5f6c4430}.station:before{content:"GA CHỮ CÁI";position:absolute;left:18px;right:18px;top:20px;background:#e9574f;color:white;border-radius:10px;padding:7px 3px;text-align:center;font-weight:1000}.station:after{content:"";position:absolute;width:55px;height:72px;left:58px;bottom:0;background:#7cc6db;border:7px solid #9b5c3e;border-bottom:0;border-radius:28px 28px 0 0}
.wrap{max-width:1180px;margin:auto;position:relative;z-index:3}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.badge{background:#fff;border:4px solid #28a8c5;border-radius:28px;padding:9px 18px;font-weight:1000;color:#176078;box-shadow:0 5px 0 #1f8fa8}.controls{display:flex;gap:9px}.round{width:58px;height:58px;border:5px solid white;border-radius:50%;background:#ffe36a;box-shadow:0 4px 0 #d6a52b;font-size:25px;cursor:pointer}
.route{margin:14px auto 9px;max-width:1040px;height:24px;border-radius:20px;background:#dff5fb;border:5px solid white;box-shadow:0 3px 8px #397e9b30;overflow:hidden}.routeFill{height:100%;background:linear-gradient(90deg,#f05d52,#ffc83d,#4ac0b7);transition:.5s}
.trackBox{max-width:1060px;height:112px;margin:0 auto 12px;position:relative}.rail{position:absolute;left:10px;right:10px;bottom:25px;height:10px;background:#6b5a4a;border-radius:8px;box-shadow:0 22px 0 #6b5a4a}.sleepers{position:absolute;left:18px;right:18px;bottom:12px;height:54px;background:repeating-linear-gradient(90deg,transparent 0 42px,#8a684f 42px 54px,transparent 54px 78px)}
.train{position:absolute;left:0;bottom:36px;width:205px;height:65px;transition:left .8s cubic-bezier(.22,.8,.3,1);filter:drop-shadow(0 7px 4px #36546c45)}
.engine{position:absolute;left:58px;bottom:0;width:120px;height:53px;background:#ef4f45;border:5px solid #a62f31;border-radius:18px 20px 10px 10px}.cab{position:absolute;left:104px;bottom:40px;width:60px;height:52px;background:#ef4f45;border:5px solid #a62f31;border-radius:12px 12px 0 0}.window{position:absolute;left:116px;bottom:56px;width:31px;height:24px;background:#bff1ff;border:4px solid #773e37;border-radius:6px}.chimney{position:absolute;left:72px;bottom:48px;width:27px;height:37px;background:#333;border-radius:5px 5px 0 0}.chimney:before{content:"";position:absolute;left:-8px;top:-8px;width:43px;height:12px;background:#333;border-radius:8px}.nose{position:absolute;left:43px;bottom:4px;width:35px;height:34px;background:#ffc63d;border:5px solid #a62f31;border-radius:50% 5px 5px 50%}.wheel{position:absolute;bottom:-15px;width:37px;height:37px;background:#303b47;border:7px solid #ffd24d;border-radius:50%}.w1{left:70px}.w2{left:133px}.smoke{position:absolute;left:52px;bottom:91px;font-size:30px;animation:puff 1.4s infinite}.flag{position:absolute;left:178px;bottom:37px;font-size:27px}
@keyframes puff{0%{transform:translate(0,0) scale(.7);opacity:.8}100%{transform:translate(-38px,-40px) scale(1.3);opacity:0}}
.scene{max-width:1030px;min-height:480px;margin:auto;background:rgba(255,253,243,.96);border:10px solid #fff2bd;border-radius:34px;padding:24px 28px 30px;text-align:center;box-shadow:0 12px 0 #d99a53,0 20px 38px #4d6d6d3b;position:relative}
.scene:before{content:"";position:absolute;left:25px;right:25px;top:14px;height:8px;border-radius:8px;background:repeating-linear-gradient(90deg,#e95650 0 45px,#ffc83d 45px 90px,#43bcb5 90px 135px,#438ed0 135px 180px)}
.title{font-size:45px;color:#e24c42;margin:20px 0 6px;text-shadow:0 3px #fff}.subtitle{font-size:23px;font-weight:800;margin:8px auto 20px;color:#39728b}
.question{font-size:31px;font-weight:1000;margin:18px auto 18px;color:#174e68}.focus{font-family:"Arial Black",Arial,sans-serif;color:#e94743;font-size:1.12em}.picture{font-size:105px;line-height:1;margin:5px auto 9px;filter:drop-shadow(0 7px 4px #4d5f6630)}
.word{display:inline-flex;gap:4px;align-items:center;justify-content:center;background:#fff0a9;border:4px solid #f1bd39;border-radius:18px;padding:9px 18px;font-family:"Arial Black",Arial,sans-serif;font-size:38px;color:#172c3a;box-shadow:0 6px 0 #dba232}
.choices{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;margin:24px auto 12px}.choice{min-width:126px;min-height:82px;padding:13px 20px;border:5px solid #d6d1c3;background:white;border-radius:22px;box-shadow:0 8px 0 #bdb5a5;font-family:"Arial Black",Arial,sans-serif;font-size:35px;font-weight:900;cursor:pointer;transition:.2s;color:#101820}.choice:hover{transform:translateY(-4px)}.choice.correct{background:#cdf4d6;border-color:#47bd70;box-shadow:0 0 25px #62d88a;transform:scale(1.08)}.choice.wrong{background:#ffd7df;border-color:#ec8194;animation:shake .3s}
.picChoice{min-width:190px}.picChoice .emoji{font-size:58px;display:block}.picChoice small{display:block;font-size:24px;margin-top:4px}
.feedback{max-width:760px;margin:20px auto 8px;padding:13px 18px;border-radius:18px;background:#d9f6df;border:3px solid #4ebf72;font-size:22px;font-weight:900}.feedback.bad{background:#fff0d9;border-color:#efb45c}
.next{position:relative;min-width:275px;margin-top:13px;border:4px solid #fff0a1;border-radius:27px;background:linear-gradient(#ffe979,#ffc72d);box-shadow:0 7px 0 #e58600,0 0 0 2px #efa000;padding:17px 34px;font-family:"Arial Black",Arial,sans-serif;font-size:25px;font-weight:900;cursor:pointer;color:#111}.next:before,.next:after{content:"✦";position:absolute;top:50%;color:#ffbd16;font-size:34px;transform:translateY(-50%);text-shadow:-16px 11px #ffd95b,-18px -10px #ffd95b}.next:before{left:-47px}.next:after{right:-47px;transform:translateY(-50%) scaleX(-1)}
.introTrain{font-size:95px;margin:8px}.tickets{display:flex;justify-content:center;gap:13px;flex-wrap:wrap;margin:18px}.ticket{padding:11px 18px;background:#fff;border:4px dashed #3eb4c4;border-radius:14px;font-size:23px;font-weight:900;transform:rotate(-2deg)}.ticket:nth-child(even){transform:rotate(2deg);border-color:#ef655b}
.arrange{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:22px}.arrange button{width:90px;height:85px;border:5px solid #4aa7c1;border-radius:20px;background:#e7f9ff;box-shadow:0 7px 0 #2c7e98;font-family:"Arial Black";font-size:36px;cursor:pointer}.slots{display:flex;justify-content:center;gap:12px;margin:18px}.slot{width:82px;height:75px;border:4px dashed #e7a42e;border-radius:17px;background:#fff9dc;font:900 35px "Arial Black";display:grid;place-items:center}
.physical{max-width:760px;margin:18px auto;background:#e7f9ff;border:4px dashed #32a8c3;border-radius:24px;padding:20px;font-size:22px;font-weight:800}.cardsRow{display:flex;justify-content:center;gap:14px;margin:16px;flex-wrap:wrap}.letterCard{width:85px;height:92px;border-radius:15px;background:#fff;border:5px solid #ef5d54;box-shadow:0 6px 0 #c5413b;display:grid;place-items:center;font:900 37px "Arial Black"}.letterCard:nth-child(2){border-color:#42b7b0;box-shadow:0 6px 0 #278f8a}.letterCard:nth-child(3){border-color:#f0b62d;box-shadow:0 6px 0 #c68c11}
.final{padding-top:35px}.trophy{font-size:110px;animation:bounce 1s infinite}.final h1{font-size:44px;color:#e54e44;margin:5px}.confetti{position:fixed;top:-30px;font-size:28px;z-index:20;animation:fall 3.5s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(500deg)}}@keyframes bounce{50%{transform:translateY(-12px)}}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media(max-width:700px){.scene{padding:20px 12px}.question{font-size:25px}.title{font-size:34px}.trackBox{transform:scale(.86);transform-origin:center}.choice{min-width:100px}.station{opacity:.55}.badge{font-size:14px}.next{min-width:230px;font-size:21px}}
</style>
</head><body>
<div class="world"><div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><div class="hill h1"></div><div class="hill h2"></div><div class="station"></div><main class="wrap" id="app"></main></div>
<script>
let screen=0,answered=false,music=true,ctx=null,timer=null,seq=[],voiceOn=true;
const instructions=[
"Chào mừng các con đến với Chuyến tàu chữ cái! Mỗi câu trả lời đúng sẽ giúp đoàn tàu tiến thêm một ga nhé!",
"Con hãy quan sát. Từ MÈO bắt đầu bằng chữ gì?",
"Con hãy quan sát từ HOA. Chữ nào đứng ở cuối từ?",
"Ô chữ còn thiếu trong từ CÁ là chữ gì?",
"Từ nào bắt đầu bằng chữ b?",
"Từ MŨ bắt đầu bằng chữ gì?",
"Con hãy chọn lần lượt các chữ H, O, A để tạo thành từ HOA.",
"Từ nào có chữ a?",
"Bây giờ mình cùng chơi với thẻ chữ thật nhé! Con hãy đưa các thẻ M, B, C về đúng toa có hình tương ứng."
];
function chooseVoice(){
 const vs=speechSynthesis.getVoices();return vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith('vi')&&/female|linh|an|hoai|mai|google/i.test(v.name))||vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith('vi'))||null
}
function speak(t){if(!voiceOn||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='vi-VN';u.rate=.88;u.pitch=1.08;const v=chooseVoice();if(v)u.voice=v;duck(.07);u.onend=()=>duck(.27);u.onerror=()=>duck(.27);speechSynthesis.speak(u)}
function audioInit(){if(ctx)return;ctx=new (window.AudioContext||window.webkitAudioContext)();ctx.master=ctx.createGain();ctx.master.gain.value=.27;ctx.master.connect(ctx.destination)}
function duck(v){if(ctx&&ctx.master)ctx.master.gain.setTargetAtTime(music?v:.0001,ctx.currentTime,.08)}
function tone(f,d=.12,type='sine',vol=.05,delay=0){if(!ctx||!music)return;const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+delay;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ctx.master);o.start(t);o.stop(t+d+.03)}
function rhythm(){if(!ctx||!music)return;[196,247,294,247].forEach((f,i)=>tone(f,.1,'triangle',.035,i*.16));tone(98,.12,'square',.018,0);tone(98,.12,'square',.018,.32)}
function startMusic(){audioInit();if(ctx.state==='suspended')ctx.resume();if(!timer){rhythm();timer=setInterval(rhythm,1280)}}
function whistle(){audioInit();[740,880,1047].forEach((f,i)=>tone(f,.18,'sine',.09,i*.12))}
function ding(){audioInit();[523,659,784].forEach((f,i)=>tone(f,.18,'sine',.10,i*.09));setTimeout(()=>speak("Chính xác! Đoàn tàu tiến thêm một ga rồi!"),250)}
function wrong(){audioInit();tone(210,.16,'triangle',.055);setTimeout(()=>speak("Con quan sát lại nhé!"),180)}
function toggleMusic(){music=!music;startMusic();duck(music ? .27 : .0001);render()}
function toggleVoice(){voiceOn=!voiceOn;if(!voiceOn)speechSynthesis.cancel();render()}
function trainHtml(){const p=Math.min(82,screen/9*82);return '<div class="trackBox"><div class="sleepers"></div><div class="rail"></div><div class="train" style="left:'+p+'%"><div class="smoke">☁️</div><div class="chimney"></div><div class="nose"></div><div class="engine"></div><div class="cab"></div><div class="window"></div><div class="wheel w1"></div><div class="wheel w2"></div><div class="flag">🚩</div></div></div>'}
function head(){return '<div class="top"><div class="badge">🚂 CHUYẾN TÀU CHỮ CÁI</div><div class="controls"><button class="round" onclick="toggleVoice()" title="Giọng hướng dẫn">'+(voiceOn?'👩‍🏫':'🔇')+'</button><button class="round" onclick="toggleMusic()" title="Nhạc nền">'+(music?'🎵':'🔕')+'</button></div></div><div class="route"><div class="routeFill" style="width:'+Math.min(100,screen/9*100)+'%"></div></div>'+trainHtml()}
function choice(label,correct,extra=''){return '<button class="choice '+extra+'" onclick="answer(this,'+correct+')">'+label+'</button>'}
function feedback(){return answered?'<div class="feedback">🚉 Chính xác! Đoàn tàu đã sẵn sàng đi tiếp.</div><button class="next" onclick="next()">TIẾP TỤC →</button>':''}
function answer(el,ok){if(answered)return;if(ok){answered=true;el.classList.add('correct');ding();whistle();setTimeout(render,650)}else{el.classList.add('wrong');wrong();setTimeout(()=>el.classList.remove('wrong'),500)}}
function start(){startMusic();whistle();screen=1;answered=false;render();setTimeout(()=>speak(instructions[1]),450)}
function next(){screen++;answered=false;seq=[];render();if(screen<9)setTimeout(()=>speak(instructions[screen]),420);else{whistle();celebrate();setTimeout(()=>speak("Tuyệt vời! Đoàn tàu đã đến Ga Chữ Cái. Các con đã hoàn thành chuyến đi rồi!"),350)}}
function pickLetter(ch,el){if(answered)return;seq.push(ch);el.disabled=true;render();if(seq.length===3){if(seq.join('')==='HOA'){answered=true;ding();whistle();setTimeout(render,650)}else{seq=[];wrong();setTimeout(render,600)}}}
function completePhysical(){if(answered)return;answered=true;ding();whistle();setTimeout(render,650)}
function celebrate(){for(let i=0;i<28;i++){setTimeout(()=>{let d=document.createElement('div');d.className='confetti';d.textContent=['⭐','🎉','🎈','✨','🚂'][i%5];d.style.left=(3+Math.random()*94)+'%';d.style.animationDuration=(2.5+Math.random()*2)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),5000)},i*70)}}
function render(){let h=head();
if(screen===0)h+='<section class="scene"><div class="introTrain">🚂✨</div><h1 class="title">CHUYẾN TÀU CHỮ CÁI</h1><div class="subtitle">Mỗi đáp án đúng sẽ đưa đoàn tàu đến gần Ga Chữ Cái hơn!</div><div class="tickets"><div class="ticket">GA MÈO 🐱</div><div class="ticket">GA HOA 🌼</div><div class="ticket">GA BÓNG ⚽</div><div class="ticket">GA KHO BÁU ⭐</div></div><button class="next" onclick="start()">LÊN TÀU NÀO! 🚂</button></section>';
if(screen===1)h+='<section class="scene"><div class="question">Từ <span class="focus">MÈO</span> bắt đầu bằng chữ gì?</div><div class="picture">🐱</div><div class="word">MÈO</div><div class="choices">'+choice('M',true)+choice('È',false)+choice('O',false)+'</div>'+feedback()+'</section>';
if(screen===2)h+='<section class="scene"><div class="question">Trong từ <span class="focus">HOA</span>, chữ nào đứng ở cuối?</div><div class="picture">🌼</div><div class="word">HOA</div><div class="choices">'+choice('H',false)+choice('O',false)+choice('A',true)+'</div>'+feedback()+'</section>';
if(screen===3)h+='<section class="scene"><div class="question">Ô chữ còn thiếu trong từ <span class="focus">CÁ</span> là chữ gì?</div><div class="picture">🐟</div><div class="word">C _</div><div class="choices">'+choice('A',true)+choice('O',false)+choice('M',false)+'</div>'+feedback()+'</section>';
if(screen===4)h+='<section class="scene"><div class="question">Từ nào bắt đầu bằng chữ <span class="focus">B</span>?</div><div class="choices">'+choice('<span class="emoji">⚽</span><small>BÓNG</small>',true,'picChoice')+choice('<span class="emoji">🐱</span><small>MÈO</small>',false,'picChoice')+choice('<span class="emoji">🐟</span><small>CÁ</small>',false,'picChoice')+'</div>'+feedback()+'</section>';
if(screen===5)h+='<section class="scene"><div class="question">Từ <span class="focus">MŨ</span> bắt đầu bằng chữ gì?</div><div class="picture">🧢</div><div class="word">MŨ</div><div class="choices">'+choice('M',true)+choice('Ũ',false)+choice('B',false)+'</div>'+feedback()+'</section>';
if(screen===6){const slots=[0,1,2].map(i=>'<div class="slot">'+(seq[i]||'')+'</div>').join('');h+='<section class="scene"><div class="question">Chọn lần lượt các chữ để tạo thành từ <span class="focus">HOA</span>.</div><div class="picture">🌼</div><div class="slots">'+slots+'</div><div class="arrange"><button onclick="pickLetter(\'O\',this)" '+(seq.includes('O')?'disabled':'')+'>O</button><button onclick="pickLetter(\'A\',this)" '+(seq.includes('A')?'disabled':'')+'>A</button><button onclick="pickLetter(\'H\',this)" '+(seq.includes('H')?'disabled':'')+'>H</button></div>'+feedback()+'</section>'}
if(screen===7)h+='<section class="scene"><div class="question">Từ nào có chữ <span class="focus">A</span>?</div><div class="choices">'+choice('<span class="emoji">🐟</span><small>CÁ</small>',true,'picChoice')+choice('<span class="emoji">🧢</span><small>MŨ</small>',false,'picChoice')+choice('<span class="emoji">🐱</span><small>MÈO</small>',false,'picChoice')+'</div>'+feedback()+'</section>';
if(screen===8)h+='<section class="scene"><div class="question">GA HOẠT ĐỘNG THẬT 🚉</div><div class="physical">Cô chuẩn bị 3 thẻ chữ. Bé cầm từng thẻ và đưa về đúng “toa tàu” có hình tương ứng:<div class="cardsRow"><div class="letterCard">M</div><div class="letterCard">B</div><div class="letterCard">C</div></div><b>M → MÈO 🐱 &nbsp; • &nbsp; B → BÓNG ⚽ &nbsp; • &nbsp; C → CÁ 🐟</b><br><br>Sau khi bé hoàn thành, cô bấm nút bên dưới.</div>'+(answered?feedback():'<button class="next" onclick="completePhysical()">BÉ ĐÃ HOÀN THÀNH ✓</button>')+'</section>';
if(screen===9)h+='<section class="scene final"><div class="trophy">🏆🚂</div><h1>ĐÃ ĐẾN GA CHỮ CÁI!</h1><div class="subtitle">Tuyệt vời! Con đã giúp đoàn tàu hoàn thành tất cả các chặng.</div><div style="font-size:58px;margin:18px">⭐ 🌈 ⭐ 🌈 ⭐</div><button class="next" onclick="screen=0;answered=false;seq=[];render();speak(instructions[0])">CHƠI LẠI ↻</button></section>';
document.getElementById('app').innerHTML=h}
render();setTimeout(()=>speak(instructions[0]),700);
</script></body></html>
