<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thám tử săn chữ – chữ m</title>
<style>
:root{--ink:#24364b;--green:#2f8f67;--yellow:#ffd66b;--cream:#fff9e8;--pink:#ff8fa3;--blue:#7bdff2;--purple:#a98bff;--shadow:0 12px 30px rgba(36,54,75,.15)}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans",sans-serif;color:var(--ink);background:linear-gradient(#bfeeff 0 46%,#bde68a 46% 100%);min-height:100vh;overflow-x:hidden}.app{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}.card{width:min(1100px,100%);min-height:min(680px,92vh);background:rgba(255,255,255,.92);border:5px solid #fff;border-radius:32px;box-shadow:var(--shadow);position:relative;overflow:hidden;padding:28px}.cloud{position:absolute;background:white;border-radius:999px;opacity:.8}.c1{width:180px;height:55px;top:20px;left:-30px}.c2{width:220px;height:65px;top:60px;right:-50px}.top{display:flex;align-items:center;gap:14px;justify-content:space-between}.progress{flex:1;height:18px;background:#e9f2e6;border-radius:99px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#ffd66b,#ff9d76);transition:.35s}.pill{background:#fff;border:2px solid #d8e8d3;border-radius:99px;padding:10px 15px;font-weight:800}.sound{border:0;background:#fff3b8;border-radius:99px;padding:11px 15px;font-size:18px;font-weight:800;cursor:pointer}.hero{text-align:center;padding:45px 10px 15px}.hero h1{font-size:clamp(38px,7vw,78px);margin:0;color:#276749;text-shadow:0 3px #fff}.bigm{font-size:clamp(110px,20vw,220px);line-height:.9;color:#ef476f;font-weight:900}.detective{font-size:80px}.lead{font-size:clamp(20px,3vw,30px);font-weight:700}.btn{border:0;border-radius:22px;padding:18px 30px;font-size:clamp(20px,2.4vw,28px);font-weight:900;cursor:pointer;box-shadow:0 7px 0 rgba(0,0,0,.12);transition:.1s}.btn:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.12)}.primary{background:#ffcf4a;color:#563b00}.next{background:#50c878;color:white;margin-top:18px}.task{text-align:center;padding:18px 6px}.task h2{font-size:clamp(30px,4.8vw,54px);margin:12px 0 8px;color:#2d6a4f}.instruction{font-size:clamp(19px,2.6vw,28px);font-weight:700;margin:8px auto 22px;max-width:850px}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:900px;margin:0 auto}.option{background:white;border:4px solid #d9ead3;border-radius:26px;min-height:170px;padding:18px;font-size:clamp(25px,4vw,46px);font-weight:900;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}.option:hover{transform:translateY(-2px)}
.correct-choice{background:#c9f7d2!important;border-color:#22a447!important;box-shadow:0 0 0 7px rgba(34,164,71,.18),0 12px 28px rgba(34,164,71,.28)!important;transform:scale(1.04)}
.wrong-choice{background:#fff0c7!important;border-color:#ffb703!important}
.listening-word{background:#fff4a8;border-radius:24px;padding:8px 24px;box-shadow:0 0 0 8px rgba(255,214,64,.22);animation:wordGlow .8s ease-in-out infinite alternate}
.pop-letter{display:inline-block;animation:letterPop .7s ease-in-out infinite alternate;color:#ef476f!important;text-shadow:0 8px 18px rgba(239,71,111,.25)}
.count-hit{background:#bdf3c8!important;box-shadow:0 0 0 7px rgba(34,164,71,.18),0 10px 24px rgba(34,164,71,.22);transform:translateY(-8px) scale(1.08);transition:.3s}
.fireworks{position:relative;height:150px;overflow:hidden;margin:0 auto 4px;max-width:760px}
.spark{position:absolute;left:50%;top:58%;width:12px;height:12px;border-radius:50%;background:var(--c);animation:burst 1.6s ease-out infinite;animation-delay:var(--d);transform:translate(-50%,-50%) rotate(var(--a)) translateY(0)}
.spark:nth-child(n+13){left:28%;top:62%}.spark:nth-child(n+25){left:72%;top:62%}
@keyframes wordGlow{from{transform:scale(1);filter:brightness(1)}to{transform:scale(1.045);filter:brightness(1.08)}}
@keyframes letterPop{from{transform:translateY(0) scale(1)}to{transform:translateY(-18px) scale(1.18)}}
@keyframes burst{0%{opacity:0;transform:translate(-50%,-50%) rotate(var(--a)) translateY(0) scale(.5)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--a)) translateY(-105px) scale(1.15)}}.emoji{font-size:70px}.lettergarden{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;max-width:800px;margin:auto}.flower{height:110px;border:0;border-radius:50% 50% 45% 45%;font-size:54px;font-weight:900;background:#ffe6ef;cursor:pointer;box-shadow:var(--shadow)}.word{font-size:clamp(70px,13vw,150px);font-weight:900;letter-spacing:.08em;color:#375a7f;margin:22px}.rowletters{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:25px}.bubble{width:92px;height:92px;border-radius:50%;background:#fff0ad;display:grid;place-items:center;font-size:52px;font-weight:900;box-shadow:var(--shadow)}.feedback{max-width:720px;margin:22px auto 0;padding:18px 22px;border-radius:24px;font-size:clamp(20px,2.5vw,28px);font-weight:900;animation:pop .25s}.ok{background:#dcf8df;border:3px solid #6ccf7d}.retry{background:#fff3cf;border:3px solid #ffc857}@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}.hint{font-size:20px;background:#eef8ff;border-radius:18px;padding:12px;margin:12px auto;max-width:700px}.hunt{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:30px}.hunt .place{background:#fff;border-radius:24px;padding:24px;min-width:190px;font-size:24px;font-weight:900;box-shadow:var(--shadow)}.finish{text-align:center;padding:40px 10px}.medal{font-size:110px}.finish h2{font-size:clamp(36px,6vw,68px);color:#a44a00}.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}.confetti span{position:absolute;font-size:28px;animation:fall 2.3s linear infinite}@keyframes fall{from{transform:translateY(-100px) rotate(0)}to{transform:translateY(800px) rotate(520deg)}}.muted{opacity:.6}.footer-note{font-size:15px;text-align:center;margin-top:18px;color:#607080}
@media(max-width:700px){.card{padding:18px;border-radius:22px}.options{grid-template-columns:1fr}.option{min-height:115px}.emoji{font-size:54px}.lettergarden{grid-template-columns:repeat(3,1fr)}.top{flex-wrap:wrap}.progress{order:3;flex-basis:100%}.hero{padding-top:25px}}
</style>
</head>
<body><div class="app"><main class="card" id="card"><div class="cloud c1"></div><div class="cloud c2"></div><div id="root"></div></main></div>
<script>
const AUDIO={
 intro:'audio/intro.mp3',task1:'audio/task1.mp3',task2:'audio/task2.mp3',task3:'audio/task3.mp3',task4:'audio/task4.mp3',task5:'audio/task5.mp3',task6:'audio/task6.mp3',task7:'audio/task7.mp3',task8:'audio/task8.mp3',correct:'audio/correct.mp3',retry:'audio/retry.mp3',finish:'audio/finish.mp3',success:'audio/success-jingle.mp3',retryCue:'audio/retry-cue.mp3',yeah:'audio/yeah.mp3',applause:'audio/applause.mp3'};
let screen=0,soundOn=true,musicOn=true,done=false,feedback='',hint='',selected7=new Set(),currentAudio=null,selectedValue='',selectedChoice=-1,wordListening=false;
let musicCtx=null,musicGain=null,musicTimer=null,musicStep=0;
const melody=[659.25,783.99,880,783.99,659.25,587.33,659.25,523.25,587.33,659.25,783.99,659.25];
function musicNote(){
 if(!musicOn||!musicCtx||musicCtx.state==='closed')return;
 const now=musicCtx.currentTime;
 const o=musicCtx.createOscillator(),o2=musicCtx.createOscillator(),g=musicCtx.createGain(),g2=musicCtx.createGain();
 const note=melody[musicStep++%melody.length];
 o.type='sine';o.frequency.value=note;o2.type='sine';o2.frequency.value=note*2;
 g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.026,now+.025);g.gain.exponentialRampToValueAtTime(.0001,now+.46);
 g2.gain.setValueAtTime(.0001,now);g2.gain.exponentialRampToValueAtTime(.007,now+.02);g2.gain.exponentialRampToValueAtTime(.0001,now+.28);
 o.connect(g);o2.connect(g2);g.connect(musicGain);g2.connect(musicGain);o.start(now);o2.start(now);o.stop(now+.48);o2.stop(now+.3);
}
function startMusic(){
 if(!musicOn)return;
 if(!musicCtx){musicCtx=new (window.AudioContext||window.webkitAudioContext)();musicGain=musicCtx.createGain();musicGain.gain.value=.62;musicGain.connect(musicCtx.destination)}
 if(musicCtx.state==='suspended')musicCtx.resume();
 if(!musicTimer){musicNote();musicTimer=setInterval(musicNote,520)}
}
function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}if(musicCtx&&musicCtx.state!=='closed')musicCtx.suspend()}
function toggleMusic(){musicOn=!musicOn;if(musicOn)startMusic();else stopMusic();render()}
function duckMusic(low){if(musicGain&&musicCtx&&musicCtx.state!=='closed')musicGain.gain.setTargetAtTime(low?.18:.75,musicCtx.currentTime,.05)}
function stopAudio(){if(currentAudio){currentAudio.pause();currentAudio.currentTime=0;currentAudio=null}if(window.speechSynthesis)window.speechSynthesis.cancel()}
function play(key,then){if(!soundOn){if(then)then();return}stopAudio();duckMusic(true);const a=new Audio(AUDIO[key]);currentAudio=a;a.volume=key==='success'?0.7:0.98;const end=()=>{currentAudio=null;duckMusic(false);if(then)then()};a.onended=end;a.onerror=end;a.play().catch(end)}
function playInstruction(){
 if(screen===3){wordListening=true;render();play('task3',()=>{wordListening=false;render()});return}
 play(screen===0?'intro':'task'+screen)
}
function correct(extra=''){done=true;feedback='ok';hint=extra;play('success',()=>play('yeah'));render()}
function wrong(){feedback='retry';hint='';play('retryCue',()=>play('retry'));render()}
function next(){stopAudio();feedback='';hint='';done=false;selectedValue='';selectedChoice=-1;if(screen<8){screen++;render();setTimeout(playInstruction,180)}else{screen=9;render();play('finish',()=>play('applause'))}}
function home(){stopAudio();stopMusic();screen=0;done=false;feedback='';hint='';selectedValue='';selectedChoice=-1;wordListening=false;selected7.clear();render()}
function start(){screen=1;startMusic();render();setTimeout(()=>play('task1'),180)}
function toggleSound(){soundOn=!soundOn;if(!soundOn)stopAudio();render()}
function topbar(){if(screen<1||screen>8)return'';return '<div class="top"><span class="pill">🔎 Nhiệm vụ '+screen+'/8</span><div class="progress"><div class="bar" style="width:'+(screen/8*100)+'%"></div></div><button class="sound" onclick="playInstruction()">🔊 Nghe nhiệm vụ</button><button class="sound" onclick="toggleMusic()">'+(musicOn?'🎵 Nhạc nền':'🎵 Bật nhạc')+'</button><button class="sound" onclick="toggleSound()">'+(soundOn?'🔉 Âm thanh':'🔇 Tắt tiếng')+'</button></div>'}
function fb(){if(!feedback)return'';return '<div class="feedback '+(feedback==='ok'?'ok':'retry')+'">'+(feedback==='ok'?'⭐ Đúng rồi! Con giỏi lắm!':'🌼 Con quan sát lại nhé!')+(hint?'<div class="hint">'+hint+'</div>':'')+'</div>'+(done?'<button class="btn next" onclick="next()">NHIỆM VỤ TIẾP THEO ➜</button>':'')}
function choose(v,ans,extra=''){
 const el=(typeof event!=='undefined'&&event.currentTarget)?event.currentTarget:null;
 const all=el&&el.parentElement?Array.from(el.parentElement.children):[];
 selectedChoice=el?all.indexOf(el):-1;selectedValue=String(v);
 v===ans?correct(extra):wrong()
}
function choose7(name){if(name==='AN'){wrong();return}selected7.add(name);feedback='';if(selected7.has('MAI')&&selected7.has('MINH'))correct('Cả MAI và MINH đều bắt đầu bằng chữ M.');else{hint='Con đã tìm đúng một bạn rồi. Còn một bạn nữa nhé!';render()}}
function render(){let h='';
if(screen===0)h='<section class="hero"><div class="detective">🕵️‍♀️🔎</div><h1>THÁM TỬ SĂN CHỮ</h1><div class="bigm">m</div><p class="lead">Cùng tìm chữ <b>m</b> qua 8 nhiệm vụ vui nhộn!</p><button class="btn primary" onclick="start()">BẮT ĐẦU ✨</button> <button class="btn" style="background:#dff3ff;margin-left:10px" onclick="play(\'intro\')">🔊 NGHE GIỚI THIỆU</button><p class="footer-note">🎧 Giọng nữ tiếng Việt • 🌟 Phản hồi vui • 🏃 Có hoạt động ngoài màn hình</p></section>';
else if(screen===1)h=topbar()+'<section class="task"><h2>🌷 Chữ m trốn ở đâu?</h2><p class="instruction">Quan sát khu vườn và chạm vào chữ <b>m</b>.</p><div class="lettergarden"><button class="flower" data-value="a" onclick="choose(\'a\',\'m\')">a</button><button class="flower" data-value="m" onclick="choose(\'m\',\'m\')">m</button><button class="flower" data-value="n" onclick="choose(\'n\',\'m\')">n</button><button class="flower" data-value="a" onclick="choose(\'a\',\'m\')">a</button><button class="flower" data-value="n" onclick="choose(\'n\',\'m\')">n</button><button class="flower" data-value="m" onclick="choose(\'m\',\'m\')">m</button></div>'+fb()+'</section>';
else if(screen===2)h=topbar()+'<section class="task"><h2>🐾 Ai bắt đầu bằng m?</h2><p class="instruction">Chọn hình có tên bắt đầu bằng chữ <b>m</b>.</p><div class="options"><button class="option" data-value="MÈO" onclick="choose(\'MÈO\',\'MÈO\')"><span class="emoji">🐱</span>MÈO</button><button class="option" data-value="CÁ" onclick="choose(\'CÁ\',\'MÈO\')"><span class="emoji">🐟</span>CÁ</button><button class="option" data-value="BÓNG" onclick="choose(\'BÓNG\',\'MÈO\')"><span class="emoji">⚽</span>BÓNG</button></div>'+fb()+'</section>';
else if(screen===3)h=topbar()+'<section class="task"><h2>🔎 Chữ m ở đâu?</h2><p class="instruction">Quan sát từ dưới đây.</p><div class="word '+(wordListening?'listening-word':'')+'">KE<span class="'+(done&&feedback==='ok'?'pop-letter':'')+'" style="color:#ef476f">M</span></div><div class="options"><button class="option" data-value="ĐẦU" onclick="choose(\'ĐẦU\',\'CUỐI\')">ĐẦU TỪ</button><button class="option" data-value="GIỮA" onclick="choose(\'GIỮA\',\'CUỐI\')">GIỮA TỪ</button><button class="option" data-value="CUỐI" onclick="choose(\'CUỐI\',\'CUỐI\')">CUỐI TỪ</button></div>'+fb()+'</section>';
else if(screen===4)h=topbar()+'<section class="task"><h2>🎩 Từ nào có chữ m?</h2><p class="instruction">Chọn từ có chữ <b>m</b>.</p><div class="options"><button class="option" data-value="MŨ" onclick="choose(\'MŨ\',\'MŨ\')"><span class="emoji">🧢</span>MŨ</button><button class="option" data-value="HOA" onclick="choose(\'HOA\',\'MŨ\')"><span class="emoji">🌼</span>HOA</button><button class="option" data-value="BÉ" onclick="choose(\'BÉ\',\'MŨ\')"><span class="emoji">🧒</span>BÉ</button></div>'+fb()+'</section>';
else if(screen===5)h=topbar()+'<section class="task"><h2>👀 m hay n?</h2><p class="instruction">Chữ nào gần giống chữ <b>m</b> nhưng không phải chữ m?</p><div class="options" style="grid-template-columns:repeat(2,1fr);max-width:650px"><button class="option" data-value="m" onclick="choose(\'m\',\'n\')"><span style="font-size:100px">m</span></button><button class="option" data-value="n" onclick="choose(\'n\',\'n\',\'Chữ m có hai bụng, còn chữ n có một bụng.\')"><span style="font-size:100px">n</span></button></div>'+fb()+'</section>';
else if(screen===6)h=topbar()+'<section class="task"><h2>🌸 Đếm chữ m</h2><p class="instruction">Có bao nhiêu chữ <b>m</b>? Con hãy chỉ từng chữ khi đếm nhé.</p><div class="rowletters"><span class="bubble">m</span><span class="bubble">a</span><span class="bubble">m</span><span class="bubble">n</span><span class="bubble">m</span><span class="bubble">b</span></div><div class="options"><button class="option" data-value="2" onclick="choose(2,3)">2</button><button class="option" data-value="3" onclick="choose(3,3)">3</button><button class="option" data-value="4" onclick="choose(4,3)">4</button></div>'+fb()+'</section>';
else if(screen===7)h=topbar()+'<section class="task"><h2>👧👦 Tên bạn nào bắt đầu bằng M?</h2><p class="instruction">Hãy tìm <b>tất cả</b> các bạn có tên bắt đầu bằng chữ M.</p><div class="options"><button class="option" onclick="choose7(\'MAI\')"><span class="emoji">👧</span>MAI '+(selected7.has('MAI')?'⭐':'')+'</button><button class="option" onclick="choose7(\'AN\')"><span class="emoji">🧒</span>AN</button><button class="option" onclick="choose7(\'MINH\')"><span class="emoji">👦</span>MINH '+(selected7.has('MINH')?'⭐':'')+'</button></div>'+(hint&&!done?'<div class="hint">'+hint+'</div>':'')+fb()+'</section>';
else if(screen===8)h=topbar()+'<section class="task"><h2>🗺️ Săn chữ thật trong lớp!</h2><p class="instruction">Rời màn hình một chút và tìm một chữ <b>m</b> thật. Khi tìm thấy, quay lại bấm nút bên dưới.</p><div class="hunt"><div class="place">🏷️<br>THẺ TÊN</div><div class="place">🧸<br>NHÃN ĐỒ VẬT</div><div class="place">📚<br>GÓC SÁCH</div></div><button class="btn primary" onclick="correct(\'Tuyệt vời! Con đã tìm chữ m trong môi trường thật.\')">CON ĐÃ TÌM THẤY! 🔎</button>'+fb()+'</section>';
else h='<section class="finish"><div class="fireworks"><i class="spark" style="--a:0deg;--d:0.00s;--c:#ff5d8f"></i><i class="spark" style="--a:30deg;--d:0.09s;--c:#ffd166"></i><i class="spark" style="--a:60deg;--d:0.18s;--c:#06d6a0"></i><i class="spark" style="--a:90deg;--d:0.27s;--c:#4dabf7"></i><i class="spark" style="--a:120deg;--d:0.36s;--c:#9b5de5"></i><i class="spark" style="--a:150deg;--d:0.45s;--c:#ff922b"></i><i class="spark" style="--a:180deg;--d:0.00s;--c:#ff5d8f"></i><i class="spark" style="--a:210deg;--d:0.09s;--c:#ffd166"></i><i class="spark" style="--a:240deg;--d:0.18s;--c:#06d6a0"></i><i class="spark" style="--a:270deg;--d:0.27s;--c:#4dabf7"></i><i class="spark" style="--a:300deg;--d:0.36s;--c:#9b5de5"></i><i class="spark" style="--a:330deg;--d:0.45s;--c:#ff922b"></i><i class="spark" style="--a:0deg;--d:0.00s;--c:#ff5d8f"></i><i class="spark" style="--a:30deg;--d:0.09s;--c:#ffd166"></i><i class="spark" style="--a:60deg;--d:0.18s;--c:#06d6a0"></i><i class="spark" style="--a:90deg;--d:0.27s;--c:#4dabf7"></i><i class="spark" style="--a:120deg;--d:0.36s;--c:#9b5de5"></i><i class="spark" style="--a:150deg;--d:0.45s;--c:#ff922b"></i><i class="spark" style="--a:180deg;--d:0.00s;--c:#ff5d8f"></i><i class="spark" style="--a:210deg;--d:0.09s;--c:#ffd166"></i><i class="spark" style="--a:240deg;--d:0.18s;--c:#06d6a0"></i><i class="spark" style="--a:270deg;--d:0.27s;--c:#4dabf7"></i><i class="spark" style="--a:300deg;--d:0.36s;--c:#9b5de5"></i><i class="spark" style="--a:330deg;--d:0.45s;--c:#ff922b"></i><i class="spark" style="--a:0deg;--d:0.00s;--c:#ff5d8f"></i><i class="spark" style="--a:30deg;--d:0.09s;--c:#ffd166"></i><i class="spark" style="--a:60deg;--d:0.18s;--c:#06d6a0"></i><i class="spark" style="--a:90deg;--d:0.27s;--c:#4dabf7"></i><i class="spark" style="--a:120deg;--d:0.36s;--c:#9b5de5"></i><i class="spark" style="--a:150deg;--d:0.45s;--c:#ff922b"></i><i class="spark" style="--a:180deg;--d:0.00s;--c:#ff5d8f"></i><i class="spark" style="--a:210deg;--d:0.09s;--c:#ffd166"></i><i class="spark" style="--a:240deg;--d:0.18s;--c:#06d6a0"></i><i class="spark" style="--a:270deg;--d:0.27s;--c:#4dabf7"></i><i class="spark" style="--a:300deg;--d:0.36s;--c:#9b5de5"></i><i class="spark" style="--a:330deg;--d:0.45s;--c:#ff922b"></i></div><div class="medal">🏅</div><h2>THÁM TỬ CHỮ CÁI XUẤT SẮC!</h2><p class="lead">Chúc mừng con đã hoàn thành 8 nhiệm vụ!</p><button class="btn primary" onclick="home()">🔁 CHƠI LẠI</button></section>';
document.getElementById('root').innerHTML=h;
 if(selectedChoice>=0){
  const choices=document.querySelectorAll('.task .options .option,.task .lettergarden .flower');
  if(choices[selectedChoice])choices[selectedChoice].classList.add(feedback==='ok'?'correct-choice':'wrong-choice');
 }
 if(screen===6&&done&&feedback==='ok'){
  document.querySelectorAll('.rowletters .bubble').forEach(b=>{if(b.textContent.trim()==='m')b.classList.add('count-hit')});
 }
}
render();
</script></body></html>
