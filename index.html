<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thám tử săn chữ m</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(#bcecff 0 48%,#b9e582 48%);color:#24415a;min-height:100vh}.wrap{max-width:1050px;margin:auto;padding:18px}.game{min-height:92vh;background:#fffdf4;border:5px solid white;border-radius:30px;padding:24px;box-shadow:0 12px 35px #3453}.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.badge,.audio{border:0;border-radius:30px;padding:11px 16px;font-weight:800;font-size:17px}.badge{background:#fff0a8}.audio{background:#dff5ff;cursor:pointer}.progress{height:18px;background:#e8eee5;border-radius:20px;flex:1;min-width:180px;overflow:hidden}.bar{height:100%;background:#ffbd59}.center{text-align:center}.title{font-size:clamp(38px,7vw,72px);color:#27805a;margin:20px 0 5px}.bigm{font-size:clamp(120px,20vw,210px);font-weight:900;color:#ef476f;line-height:.9}.lead{font-size:clamp(20px,3vw,29px);font-weight:700}.btn,.opt{border:0;cursor:pointer;font-weight:900;box-shadow:0 7px 0 #0002}.btn{border-radius:22px;padding:17px 28px;font-size:clamp(20px,2.6vw,28px);background:#ffd45b}.next{background:#55c77b;color:white;margin-top:16px}.task h2{font-size:clamp(30px,5vw,52px);color:#287052;text-align:center;margin:16px 0 8px}.instruction{text-align:center;font-size:clamp(19px,2.6vw,27px);font-weight:700}.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:900px;margin:25px auto}.opt{min-height:155px;border:4px solid #dcebd4;border-radius:26px;background:white;font-size:clamp(27px,4vw,46px);padding:15px}.emo{display:block;font-size:65px}.garden{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;max-width:800px;margin:30px auto}.flower{height:105px;border:0;border-radius:50%;font-size:52px;font-weight:900;background:#ffe4ef;cursor:pointer;box-shadow:0 8px 20px #3453}.word{text-align:center;font-size:clamp(80px,14vw,150px);font-weight:900;letter-spacing:.08em;color:#416789;margin:25px}.letters{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:25px}.bubble{width:90px;height:90px;border-radius:50%;display:grid;place-items:center;background:#fff0a8;font-size:50px;font-weight:900}.fb{max-width:720px;margin:20px auto;text-align:center;padding:17px;border-radius:22px;font-size:clamp(20px,2.5vw,27px);font-weight:900}.ok{background:#dcf8df;border:3px solid #68c87a}.bad{background:#fff1cb;border:3px solid #ffc857}.places{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:28px}.place{background:white;border-radius:22px;padding:22px;min-width:180px;font-size:24px;font-weight:900;box-shadow:0 8px 22px #3453}.finish{padding:60px 10px;text-align:center}.finish h2{font-size:clamp(36px,6vw,65px);color:#a65000}@media(max-width:700px){.opts{grid-template-columns:1fr}.opt{min-height:105px}.garden{grid-template-columns:repeat(3,1fr)}}</style></head><body><div class="wrap"><main class="game"><div id="root"></div></main></div><script>
const A={intro:'audio/intro.mp3',1:'audio/task1.mp3',2:'audio/task2.mp3',3:'audio/task3.mp3',4:'audio/task4.mp3',5:'audio/task5.mp3',6:'audio/task6.mp3',7:'audio/task7.mp3',8:'audio/task8.mp3',correct:'audio/correct.mp3',retry:'audio/retry.mp3',finish:'audio/finish.mp3',success:'audio/success-jingle.mp3',retryCue:'audio/retry-cue.mp3'};let s=0,done=false,fb='',sound=true,sel=new Set(),cur=null;function stop(){if(cur){cur.pause();cur=null}}function play(k,next){if(!sound){next&&next();return}stop();let a=new Audio(A[k]);cur=a;a.volume=k==='success'?.65:.95;a.onended=()=>{cur=null;next&&next()};a.onerror=()=>{cur=null;next&&next()};a.play().catch(()=>next&&next())}function top(){return s<1||s>8?'':`<div class="top"><span class="badge">🔎 Nhiệm vụ ${s}/8</span><div class="progress"><div class="bar" style="width:${s*12.5}%"></div></div><button class="audio" onclick="play(s)">🔊 Nghe nhiệm vụ</button><button class="audio" onclick="sound=!sound;stop();render()">${sound?'🔉 Âm thanh':'🔇 Tắt tiếng'}</button></div>`}function feedback(){if(!fb)return'';return `<div class="fb ${fb==='ok'?'ok':'bad'}">${fb==='ok'?'⭐ Đúng rồi! Con giỏi lắm!':'🌼 Chưa đúng rồi. Con quan sát lại nhé!'}</div>${done?'<div class="center"><button class="btn next" onclick="next()">NHIỆM VỤ TIẾP THEO ➜</button></div>':''}`}function right(){done=true;fb='ok';play('success',()=>play('correct'));render()}function wrong(){fb='bad';play('retryCue',()=>play('retry'));render()}function choose(v,a){v===a?right():wrong()}function next(){stop();fb='';done=false;if(s<8){s++;render()}else{s=9;render();play('finish')}}function start(){s=1;render();setTimeout(()=>play(1),150)}function home(){stop();s=0;done=false;fb='';sel.clear();render()}function multi(n){if(n==='AN'){wrong();return}sel.add(n);fb='';if(sel.has('MAI')&&sel.has('MINH'))right();else{play('success');render()}}
function render(){let h='';if(s===0)h=`<section class="center"><h1 class="title">THÁM TỬ SĂN CHỮ</h1><div class="bigm">m</div><div style="font-size:75px">🕵️‍♀️🔎🌼</div><p class="lead">8 nhiệm vụ vui nhộn dành cho thám tử nhí 5–6 tuổi</p><button class="btn" onclick="start()">BẮT ĐẦU 🚀</button><p><button class="audio" onclick="play('intro')">🔊 Nghe lời chào</button></p></section>`;else if(s===1)h=`${top()}<section class="task"><h2>🌷 Chữ m trốn ở đâu?</h2><p class="instruction">Quan sát khu vườn và chạm vào chữ <b>m</b>.</p><div class="garden">${['a','n','m','b','o','m','e','n','a','m'].map(x=>`<button class="flower" onclick="choose('${x}','m')">${x}</button>`).join('')}</div>${feedback()}</section>`;else if(s===2)h=`${top()}<section class="task"><h2>🐱 Ai bắt đầu bằng m?</h2><p class="instruction">Chọn đồ vật có tên bắt đầu bằng chữ <b>m</b>.</p><div class="opts"><button class="opt" onclick="choose('MÈO','MÈO')"><span class="emo">🐱</span>MÈO</button><button class="opt" onclick="choose('CÁ','MÈO')"><span class="emo">🐟</span>CÁ</button><button class="opt" onclick="choose('BÓNG','MÈO')"><span class="emo">⚽</span>BÓNG</button></div>${feedback()}</section>`;else if(s===3)h=`${top()}<section class="task"><h2>🍦 Chữ m ở đâu?</h2><div class="word">KEM</div><p class="instruction">Chữ m nằm ở vị trí nào?</p><div class="opts"><button class="opt" onclick="choose(1,3)">ĐẦU TỪ</button><button class="opt" onclick="choose(2,3)">GIỮA TỪ</button><button class="opt" onclick="choose(3,3)">CUỐI TỪ</button></div>${feedback()}</section>`;else if(s===4)h=`${top()}<section class="task"><h2>🎩 Từ nào có chữ m?</h2><div class="opts"><button class="opt" onclick="choose('MŨ','MŨ')"><span class="emo">🧢</span>MŨ</button><button class="opt" onclick="choose('HOA','MŨ')"><span class="emo">🌸</span>HOA</button><button class="opt" onclick="choose('BÉ','MŨ')"><span class="emo">🧒</span>BÉ</button></div>${feedback()}</section>`;else if(s===5)h=`${top()}<section class="task"><h2>👀 m hay n?</h2><p class="instruction">Chữ nào gần giống chữ m nhưng không phải chữ m?</p><div class="opts" style="grid-template-columns:repeat(2,1fr);max-width:650px"><button class="opt" style="font-size:95px" onclick="choose('m','n')">m</button><button class="opt" style="font-size:95px" onclick="choose('n','n')">n</button></div>${feedback()}</section>`;else if(s===6)h=`${top()}<section class="task"><h2>🌼 Đếm chữ m</h2><p class="instruction">Có bao nhiêu chữ m?</p><div class="letters">${['m','a','m','n','m','b'].map(x=>`<span class="bubble">${x}</span>`).join('')}</div><div class="opts"><button class="opt" onclick="choose(2,3)">2</button><button class="opt" onclick="choose(3,3)">3</button><button class="opt" onclick="choose(4,3)">4</button></div>${feedback()}</section>`;else if(s===7)h=`${top()}<section class="task"><h2>👧👦 Tên bạn nào bắt đầu bằng M?</h2><p class="instruction">Hãy tìm <b>tất cả</b> các bạn có tên bắt đầu bằng chữ M.</p><div class="opts"><button class="opt" onclick="multi('MAI')"><span class="emo">👧</span>MAI ${sel.has('MAI')?'⭐':''}</button><button class="opt" onclick="multi('AN')"><span class="emo">🧒</span>AN</button><button class="opt" onclick="multi('MINH')"><span class="emo">👦</span>MINH ${sel.has('MINH')?'⭐':''}</button></div>${feedback()}</section>`;else if(s===8)h=`${top()}<section class="task center"><h2>🗺️ Săn chữ thật trong lớp!</h2><p class="instruction">Rời màn hình một chút và tìm một chữ <b>m</b> thật trong lớp.</p><div class="places"><div class="place">🏷️<br>THẺ TÊN</div><div class="place">🧸<br>NHÃN ĐỒ VẬT</div><div class="place">📚<br>GÓC SÁCH</div></div><button class="btn" onclick="right()">CON ĐÃ TÌM THẤY! 🔎</button>${feedback()}</section>`;else h=`<section class="finish"><div style="font-size:110px">🏅</div><h2>THÁM TỬ CHỮ CÁI XUẤT SẮC!</h2><p class="lead">Chúc mừng con đã hoàn thành 8 nhiệm vụ!</p><button class="btn" onclick="home()">🔁 CHƠI LẠI</button></section>`;document.getElementById('root').innerHTML=h}render();</script></body></html>
