<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SP2 – Chữ nào biến mất?</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:radial-gradient(circle at 50% 15%,#56358f 0,#241342 48%,#110820 100%);min-height:100vh;color:#fff;overflow-x:hidden}.stage{min-height:100vh;padding:24px;position:relative}.stage:before,.stage:after{content:"";position:fixed;top:0;width:18vw;height:100vh;background:linear-gradient(90deg,#7b163a,#c52d5b 55%,#6d1233);z-index:0;box-shadow:inset 0 0 35px #3a071b}.stage:before{left:0;border-radius:0 0 60% 0}.stage:after{right:0;transform:scaleX(-1);border-radius:0 0 60% 0}.stars{position:fixed;inset:0;pointer-events:none;z-index:1;background-image:radial-gradient(#ffd85a 1.6px,transparent 2px),radial-gradient(#fff 1px,transparent 1.5px);background-size:70px 70px,110px 110px;background-position:0 0,25px 30px;opacity:.6}.card{position:relative;z-index:2;max-width:1080px;margin:auto;background:rgba(31,18,57,.9);border:4px solid #e5c35c;border-radius:34px;box-shadow:0 18px 70px #08020f,0 0 35px rgba(255,220,95,.28);padding:28px;min-height:680px}.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.pill,.sound{border:2px solid #e5c35c;background:#3d246a;color:#fff;border-radius:999px;padding:10px 16px;font-weight:800}.sound{cursor:pointer}.progress{height:15px;background:#1b102f;border-radius:99px;flex:1;min-width:170px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#ffcf4b,#ff6fb1)}h1,h2{text-align:center;margin:18px 0 8px}.title{font-size:52px;color:#ffe27a;text-shadow:0 4px #6b2e72}.subtitle{text-align:center;font-size:22px;color:#f7eefe}.hat{font-size:100px;text-align:center;filter:drop-shadow(0 12px 15px #09030e)}.btn{border:0;border-radius:20px;padding:18px 28px;font-size:25px;font-weight:900;cursor:pointer;box-shadow:0 8px 0 rgba(0,0,0,.25);transition:.2s}.primary{background:#ffd75e;color:#35194f}.btn:hover,.option:hover{transform:translateY(-3px)}.center{text-align:center}.letters,.options{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:34px auto}.letter,.option{min-width:120px;min-height:105px;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:55px;font-weight:900;background:linear-gradient(#fff,#f6eaff);color:#3c2368;border:5px solid #d5b7ff;box-shadow:0 9px 0 #24143e;cursor:pointer}.letter{cursor:default}.vanish{animation:poof .8s forwards}.fill-answer{animation:flyUp .7s cubic-bezier(.2,.85,.25,1.25) both;background:#bff2c8!important;border-color:#5bd174!important;color:#214b2b!important}
.confirm-row{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:22px auto}.confirm-letter{width:78px;height:72px;border-radius:18px;background:#fff;color:#3c2368;border:4px solid #d5b7ff;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;opacity:0;animation:slideIn .48s forwards}.confirm-letter.changed{background:#fff0a8;border-color:#ffd43b;box-shadow:0 0 18px #ffd43b}
.mystery{background:linear-gradient(#8a63c7,#5b358e);color:#ffe475;border-color:#ffe475}.correct{background:#bff2c8!important;border-color:#5bd174!important;box-shadow:0 0 0 8px rgba(91,209,116,.18),0 9px 0 #225b2d!important;transform:scale(1.06)}.wrong{background:#ffd4df!important;border-color:#ff7b9c!important}.feedback{max-width:720px;margin:22px auto;padding:18px;border-radius:20px;text-align:center;font-size:25px;font-weight:900}.ok{background:#174e38;border:3px solid #66e0a3}.retry{background:#5a2b45;border:3px solid #ff93b4}.task p{text-align:center;font-size:22px}.magic{font-size:90px;text-align:center;animation:float 2s ease-in-out infinite}.curtain{font-size:70px}.pair{font-size:35px}.physical{background:#49306d;border:3px dashed #ffe27a;border-radius:25px;padding:28px;max-width:760px;margin:28px auto;text-align:center}.final{position:relative;text-align:center;padding-top:20px}.final .curtainOpen{font-size:110px}.final h2{font-size:46px;color:#ffe27a}.spark{position:fixed;z-index:20;font-size:28px;animation:spark 2.2s linear infinite;pointer-events:none}.spot{position:absolute;top:0;width:180px;height:520px;background:linear-gradient(to bottom,rgba(255,244,175,.35),transparent);clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);pointer-events:none}.s1{left:12%;transform:rotate(18deg)}.s2{right:12%;transform:rotate(-18deg)}@keyframes flyUp{0%{opacity:.2;transform:translateY(180px) scale(.72)}65%{opacity:1;transform:translateY(-12px) scale(1.12)}100%{opacity:1;transform:translateY(0) scale(1)}}@keyframes slideIn{0%{opacity:0;transform:translateX(-70px) scale(.65)}70%{opacity:1;transform:translateX(8px) scale(1.08)}100%{opacity:1;transform:translateX(0) scale(1)}}
@keyframes poof{0%{opacity:1;transform:scale(1)}45%{opacity:.2;filter:blur(8px);transform:scale(1.35) rotate(8deg)}100%{opacity:0;transform:scale(.2)}}@keyframes float{50%{transform:translateY(-12px) rotate(4deg)}}@keyframes spark{0%{transform:translateY(105vh) rotate(0);opacity:0}20%{opacity:1}100%{transform:translateY(-10vh) rotate(360deg);opacity:0}}@media(max-width:700px){.card{padding:16px;min-height:92vh}.title{font-size:38px}.letter,.option{min-width:86px;min-height:80px;font-size:40px}.stage{padding:10px}.stage:before,.stage:after{width:8vw}}
</style></head><body><div class="stage"><div class="stars"></div><main class="card" id="root"></main></div><script>
const A={intro:'audio/intro.mp3',t1:'audio/task1.mp3',t2:'audio/task2.mp3',t3:'audio/task3.mp3',t4:'audio/task4.mp3',t5:'audio/task5.mp3',t6:'audio/task6.mp3',t7:'audio/task7.mp3',t8:'audio/task8.mp3',finish:'audio/finish.mp3',magic:'audio/magic.mp3',finale:'audio/finale.mp3',correct:'audio/correct.mp3',retry:'audio/retry.mp3',correctA:'audio/correct-a.mp3',correctB:'audio/correct-b.mp3',correctSwap:'audio/correct-swap.mp3'};
let screen=0,sound=true,music=true,answer=-1,feedback='',audio=null,ctx=null,gain=null,timer=null,step=0,magicPhase=false,phaseTimer=null,solvedReveal=false;
const tune=[392,523.25,493.88,659.25,587.33,523.25,440,523.25,392,493.88,587.33,659.25];
function musicNote(){if(!music||!ctx)return;const n=tune[step++%tune.length],o=ctx.createOscillator(),g=ctx.createGain();o.type=step%3?'sine':'triangle';o.frequency.value=n;g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.025,ctx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.42);o.connect(g);g.connect(gain);o.start();o.stop(ctx.currentTime+.44)}
function startMusic(){if(!music)return;if(!ctx){ctx=new(window.AudioContext||window.webkitAudioContext)();gain=ctx.createGain();gain.gain.value=.55;gain.connect(ctx.destination)}if(ctx.state==='suspended')ctx.resume();if(!timer){musicNote();timer=setInterval(musicNote,540)}}
function toggleMusic(){music=!music;if(music)startMusic();else{clearInterval(timer);timer=null;ctx&&ctx.suspend()}render()}
function play(k,next){if(!sound){next&&next();return}if(audio){audio.pause();audio=null}if(gain&&ctx&&ctx.state==='running')gain.gain.setTargetAtTime(.12,ctx.currentTime,.05);const a=new Audio(A[k]);audio=a;const end=()=>{audio=null;if(gain&&ctx&&ctx.state==='running')gain.gain.setTargetAtTime(.55,ctx.currentTime,.08);next&&next()};a.onended=end;a.onerror=end;a.play().catch(end)}
function topbar(){if(screen<1||screen>8)return'';return '<div class="top"><span class="pill">🎩 Màn '+screen+'/8</span><div class="progress"><div class="bar" style="width:'+(screen/8*100)+'%"></div></div><button class="sound" onclick="play(\'t'+screen+'\')">🔊 Nghe nhiệm vụ</button><button class="sound" onclick="toggleMusic()">🎵 '+(music?'Nhạc phép thuật':'Bật nhạc')+'</button></div>'}
function choose(i,ok){answer=i;feedback=ok?'ok':'retry';if(ok&&(screen===2||screen===4))solvedReveal=true;render();if(ok){const voice=screen===2?'correctA':(screen===4||screen===7?'correctB':(screen===6?'correctSwap':'correct'));play('magic',()=>play(voice))}else play('retry')}
function next(){answer=-1;feedback='';solvedReveal=false;magicPhase=false;clearTimeout(phaseTimer);screen++;render();if(screen===2||screen===4){magicPhase=true;render();phaseTimer=setTimeout(()=>{magicPhase=false;render();play('t'+screen)},1100)}else if(screen<=8)setTimeout(()=>play('t'+screen),250);else play('finish',()=>play('finale'))}
function fb(){if(!feedback)return'';let msg=feedback==='ok'?'✨ Chính xác! Phép thuật đã được hóa giải!':'🌙 Con quan sát lại một lần nữa nhé!';if(feedback==='ok'&&screen===2)msg='✨ Chính xác rồi! Đó là chữ â. Con đã hóa giải phép thuật!';if(feedback==='ok'&&(screen===4||screen===7))msg='✨ Chính xác rồi! Đó là chữ b. Con đã hóa giải phép thuật!';if(feedback==='ok'&&screen===6)msg='✨ Chính xác rồi! Hai chữ ô và ơ đã đổi chỗ.';return '<div class="feedback '+feedback+'">'+msg+'</div>'+(feedback==='ok'?'<div class="center"><button class="btn primary" onclick="next()">MÀN TIẾP THEO ➜</button></div>':'')}
function opts(items,correct){return '<div class="options">'+items.map((x,i)=>'<button class="option '+(answer===i?(i===correct?'correct':'wrong'):'')+'" onclick="choose('+i+','+(i===correct)+')">'+x+'</button>').join('')+'</div>'}
function render(){
 let h='';
 if(screen===0)h='<div class="spot s1"></div><div class="spot s2"></div><div class="hat">🎩✨</div><h1 class="title">CHỮ NÀO BIẾN MẤT?</h1><p class="subtitle">Sân khấu phép thuật của những chữ cái</p><div class="center"><button class="btn primary" onclick="startMusic();play(\'intro\',()=>{screen=1;render();play(\'t1\')})">MỞ MÀN ẢO THUẬT ✨</button></div>';
 else if(screen===1)h=topbar()+'<section class="task"><div class="magic">🪄</div><h2>GHI NHỚ THẬT KỸ</h2><p>Con hãy quan sát 5 chữ cái trên sân khấu.</p><div class="letters">'+['a','ă','â','e','ê'].map(x=>'<div class="letter">'+x+'</div>').join('')+'</div><div class="center"><button class="btn primary" onclick="next()">CON ĐÃ NHỚ 👀</button></div></section>';
 else if(screen===2)h=topbar()+`<section class="task"><div class="magic">💨✨</div><h2>ÚM BA LA! CHỮ NÀO BIẾN MẤT?</h2><div class="letters"><div class="letter">a</div><div class="letter">ă</div><div class="letter ${solvedReveal?'fill-answer':(magicPhase?'vanish':'mystery')}">${solvedReveal?'â':(magicPhase?'â':'?')}</div><div class="letter">e</div><div class="letter">ê</div></div>`+opts(['â','ơ','o'],0)+fb()+'</section>';
 else if(screen===3)h=topbar()+'<section class="task"><div class="magic">🔮</div><h2>GHI NHỚ LẦN NỮA</h2><p>m – n – b – d – p. Nhìn thật kỹ nhé!</p><div class="letters">'+['m','n','b','d','p'].map(x=>'<div class="letter">'+x+'</div>').join('')+'</div><div class="center"><button class="btn primary" onclick="next()">CON ĐÃ NHỚ 👀</button></div></section>';
 else if(screen===4)h=topbar()+`<section class="task"><div class="magic">🎩💫</div><h2>MỘT CHỮ LẠI BIẾN MẤT!</h2><div class="letters"><div class="letter">m</div><div class="letter">n</div><div class="letter ${solvedReveal?'fill-answer':(magicPhase?'vanish':'mystery')}">${solvedReveal?'b':(magicPhase?'b':'?')}</div><div class="letter">d</div><div class="letter">p</div></div>`+opts(['b','q','a'],0)+fb()+'</section>';
 else if(screen===5)h=topbar()+'<section class="task"><div class="magic">🌟</div><h2>NHỚ ĐÚNG VỊ TRÍ</h2><p>Con hãy nhìn thứ tự của các chữ.</p><div class="letters">'+['o','ô','ơ','a','ă','â'].map(x=>'<div class="letter">'+x+'</div>').join('')+'</div><div class="center"><button class="btn primary" onclick="next()">CON ĐÃ NHỚ 🧠</button></div></section>';
 else if(screen===6)h=topbar()+'<section class="task"><div class="magic">🪄</div><h2>HAI CHỮ ĐÃ ĐỔI CHỖ</h2><p>Dãy mới là: o – ơ – ô – a – ă – â. Cặp nào bị đổi chỗ?</p>'+opts(['ô và ơ','a và ă','o và â'],0)+(feedback==='ok'?'<div class="confirm-row">'+['o','ô','ơ','a','ă','â'].map((x,i)=>'<div class="confirm-letter '+((i===1||i===2)?'changed':'')+'" style="animation-delay:'+(i*.12)+'s">'+x+'</div>').join('')+'</div>':'')+fb()+'</section>';
 else if(screen===7)h=topbar()+'<section class="task"><div class="magic">🎭</div><h2>CHỮ NÀO SAU TẤM RÈM?</h2><div class="physical"><div class="curtain">🎪 ❓ 🎪</div><p class="pair">Gợi ý: chữ này đứng giữa <b>n</b> và <b>d</b> trong dãy đã học.</p></div>'+opts(['b','m','p'],0)+(feedback==='ok'?'<div class="center"><div class="letter fill-answer" style="display:inline-flex">b</div></div>':'')+fb()+'</section>';
 else if(screen===8)h=topbar()+'<section class="task"><div class="magic">🃏✨</div><h2>PHÉP THUẬT NGOÀI MÀN HÌNH</h2><div class="physical"><p>👩‍🏫 Cô đặt 4–5 <b>thẻ chữ thật</b>.</p><p>🙈 Con nhắm mắt – cô giấu một thẻ.</p><p>👀 Con mở mắt, tìm và nói tên chữ đã biến mất.</p></div><div class="center"><button class="btn primary" onclick="feedback=\'ok\';render();play(\'magic\')">CON ĐÃ TÌM RA! ⭐</button></div>'+fb()+'</section>';
 else{const ss=Array.from({length:34},(_,i)=>'<i class="spark" style="left:'+((i*37)%100)+'%;animation-delay:-'+((i%9)*.23)+'s">'+(i%3?'✦':'★')+'</i>').join('');h='<section class="final">'+ss+'<div class="curtainOpen">🎭✨🎩✨🎭</div><h2>NHÀ ẢO THUẬT CHỮ CÁI XUẤT SẮC!</h2><p class="subtitle">Con đã phá giải tất cả phép thuật!</p><button class="btn primary" onclick="screen=0;feedback=\'\';render()">🔁 CHƠI LẠI</button></section>'}
 document.getElementById('root').innerHTML=h
}
render();
</script></body></html>
