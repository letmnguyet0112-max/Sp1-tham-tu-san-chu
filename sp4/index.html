<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{box-sizing:border-box}body{margin:0;font-family:"Trebuchet MS",Arial,sans-serif;background:#fff1d8;color:#31565a;overflow-x:hidden}.world{min-height:100vh;background:linear-gradient(180deg,#fff0c9 0 18%,#fffaf0 18% 82%,#c9f1e5 82%);position:relative;padding:28px 14px 90px}.world:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 12% 24%,#fff8b8 0 7%,transparent 7.3%),radial-gradient(circle at 90% 28%,#d9f7ff 0 8%,transparent 8.3%);opacity:.55;pointer-events:none}.garland{position:fixed;top:0;left:0;right:0;text-align:center;font-size:35px;letter-spacing:16px;z-index:1}.board{max-width:1120px;min-height:650px;margin:auto;background:linear-gradient(180deg,#fffef9,#fff9ea);border:10px solid #efbd72;border-radius:28px;box-shadow:0 15px 0 #bd8252,0 22px 35px #9f705044;position:relative;z-index:2;padding:28px 38px 36px}.top{display:flex;justify-content:space-between;align-items:center}.badge{background:#fff;border:3px solid #8bd7c5;border-radius:30px;padding:8px 16px;font-weight:900}.controls button{border:0;background:#fff0b8;border-radius:50%;width:46px;height:46px;font-size:22px;cursor:pointer}.progress{height:13px;background:#f4d9d0;border-radius:20px;margin:14px 0 22px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#ff8f82,#65cbb7);transition:.4s}.title{text-align:center;color:#e36d62;font-size:46px;margin:12px 0}.sub{text-align:center;font-size:23px}.classroom{display:flex;justify-content:center;gap:16px;align-items:flex-end;margin:22px auto;flex-wrap:wrap}.classroom .avatar{width:118px}.teacher-board{max-width:720px;margin:18px auto;background:#477b72;color:#fffbe8;border:10px solid #c18a57;border-radius:12px;padding:20px;text-align:center;box-shadow:0 7px 0 #9c6841;font-size:29px;font-weight:900}.scene{text-align:center}.question{font-size:30px;font-weight:900;margin:8px auto 18px}.target{display:inline-block;font-size:1.55em;color:#ff6f61;text-shadow:0 3px #ffe4a8}.cards{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;margin:20px auto}.kid{width:210px;background:#fff;border:5px solid #b8e4d7;border-radius:25px;padding:14px;box-shadow:0 8px 0 #9bcabb;cursor:pointer;transition:.25s}.kid:hover{transform:translateY(-5px)}.kid.correct{background:#d8f8df;border-color:#58ca7b;transform:translateY(-12px) scale(1.08);box-shadow:0 0 25px #70d990}.kid.wrong{animation:shake .3s}.avatar{width:112px;height:112px;margin:0 auto 6px;filter:drop-shadow(0 5px 4px #7a5b4030)}.avatar svg{width:100%;height:100%;display:block}.namecard{font-size:35px;font-weight:900;margin-top:6px;background:#fff1b8;border-radius:14px;padding:6px}.initial{color:#e35f55;font-size:1em;display:inline-block;transform-origin:50% 80%}.kid.correct .initial{animation:letterPop .72s cubic-bezier(.2,1.7,.4,1) both;color:#e34f43;text-shadow:0 4px 0 #fff,0 0 16px #ffd45c}.initial.a{color:#6f69c9}.choice-row{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:20px}.choice{min-width:120px;padding:16px 24px;border:4px solid #d9d3c5;background:#fff;border-radius:22px;box-shadow:0 7px 0 #c9c0ae;font-size:34px;font-weight:900;cursor:pointer}.choice.correct{background:#c9f5d5;border-color:#55c878;transform:scale(1.16);box-shadow:0 0 25px #75dc91}.choice.wrong{background:#ffd7df;border-color:#ef8ca0;animation:shake .3s}.feedback{max-width:700px;margin:22px auto 10px;padding:14px;border-radius:18px;background:#daf7df;border:3px solid #5ac979;font-size:23px;font-weight:900}.next{border:0;border-radius:22px;background:#ffd166;box-shadow:0 7px 0 #d99f2d;padding:16px 28px;font-size:22px;font-weight:900;cursor:pointer}.fly-letter{position:fixed;z-index:20;font-size:80px;font-weight:1000;color:#ff665b;text-shadow:0 4px white;animation:flyBoard 1.15s ease-in forwards;left:50%;top:52%}.pair{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}.pair button{font-size:24px}.physical{max-width:760px;margin:25px auto;padding:25px;background:#eefbf7;border:4px dashed #55bca7;border-radius:25px;font-size:23px}.groupM{margin:18px auto;width:300px;padding:18px;background:#ffe0d7;border:5px dashed #f18b7c;border-radius:30px;font-size:34px;font-weight:900}.balloon{position:fixed;bottom:-100px;font-size:55px;animation:floatUp 5s linear forwards;z-index:10}.stars{font-size:50px;animation:party .7s infinite alternate}.deskline{position:fixed;bottom:0;left:0;right:0;height:80px;background:repeating-linear-gradient(90deg,#d59a65 0 110px,#c68652 110px 125px);border-top:8px solid #9b6a45}
@keyframes letterPop{0%{transform:translateY(0) scale(1)}45%{transform:translateY(-24px) scale(1.65) rotate(-4deg)}70%{transform:translateY(-10px) scale(1.38) rotate(3deg)}100%{transform:translateY(-14px) scale(1.45)}}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}@keyframes flyBoard{0%{transform:translate(-50%,0) scale(1);opacity:1}65%{transform:translate(-50%,-260px) scale(1.5)}100%{transform:translate(-50%,-300px) scale(.8);opacity:0}}@keyframes floatUp{to{transform:translateY(-120vh) rotate(20deg)}}@keyframes party{to{transform:scale(1.08)}}@media(max-width:700px){.board{padding:20px 12px}.title{font-size:34px}.kid{width:150px}.avatar{font-size:55px}.namecard{font-size:27px}}
</style></head><body><div class="world"><div class="garland">⭐ 🍎 ✏️ 🌈 📚 ⭐ 🍎 ✏️ 🌈 📚</div><div class="deskline"></div><main class="board" id="app"></main></div>
<script>
const A={intro:"https://dnznrvs05pmza.cloudfront.net/text_to_speech/2f48d519-7459-46a9-81b3-370526f2eb2a/sp4_intro.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMTZjZGJiMDBmZGM4OWM5OCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDgxNTEwNH0.2FsMl5Az6a3p2cRPhO3Y9RbMmVv8Xk50-RQV2ahjHgA",t1:"https://dnznrvs05pmza.cloudfront.net/text_to_speech/36de7da9-be53-4acc-a9e4-14beef95e942/sp4_t1.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZDMyOTJiMjhiNDhjNTk4ZSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDc1NzgwMH0.rXvkDgWk9iWm5-mpOyMqkwswbopzjFibvPQG_qugymk",t2:"https://dnznrvs05pmza.cloudfront.net/text_to_speech/575501a6-2e7b-473b-aa16-1889c1556673/sp4_t2.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiODBkZDRmNzY3ZTkyODBhMCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDgxMzA0Nn0.ANT862puMOlngxJOPSCwRuQgVGelpuTgd7A_cFcUFeU",t3:"https://dnznrvs05pmza.cloudfront.net/text_to_speech/3ad62b62-9904-47ef-a555-d976eded76da/sp4_t3.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiM2RlNTk0YmVmMzhmM2I5ZCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDgyNzE5OH0.aa8QnFxFNqG55zW_3cuOv3jwAb4PVScAO2y9HRWi7M4",t4:"https://dnznrvs05pmza.cloudfront.net/text_to_speech/039fa01a-1a43-4888-99e4-0fe44ed332ca/sp4_t4.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYWMzYmQzODJiYjY4MjJlMiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDc2NjcyMn0.0ODMzodpR9FrKrmW0Pt8_3kwF83kO2JzU47XJF5oJ9E",t5:"https://dnznrvs05pmza.cloudfront.net/text_to_speech/a0a1cf10-7a25-42f0-9f74-f874a6afdc3a/sp4_t5.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMDJmMDU1YjAzNmU2NTdhOSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDc4MzQwOH0.E2I0SVyx5ntC25tCb67qJnhsogD2PwUU0GQJLgmFBF0",t6:"https://dnznrvs05pmza.cloudfront.net/text_to_speech/48ff5c73-d30e-45ce-a4e5-9f5fa4570a3e/sp4_t6.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZjgzMjk1YzkxZDY3OGEwZCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDc0MzExM30.UjiigtcQe9mw4uia4kCqbdKIxWUIAY5Zgy5Xdm0t7J8",t7:"https://dnznrvs05pmza.cloudfront.net/text_to_speech/6471a962-502c-400c-8b97-097603c03e26/sp4_t7.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNmZmOWFjOGE0YWYyOTcwYyIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDc2NDgxMH0.8_5LBoedAI-DHGcXR4f3YsjniTw9UOUnTjLgGxY4MuI",t8:"https://dnznrvs05pmza.cloudfront.net/text_to_speech/9bc2044d-2454-4670-b407-891d086752a7/sp4_t8.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMTgxMTg3OTJlMjk2YjIzZiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDc4MTIwMn0.UjFasMjoVg3d85cTo4THdxGIWZTmrbHYXMoO2rR64U8",finish:"https://dnznrvs05pmza.cloudfront.net/text_to_speech/bf87116a-5a23-4d2b-b606-7a7f7cc976da/sp4_finish.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZTg0NDlmODA0NGU4Njg1MiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDgxMTM5Mn0.oGdF822i98Mp3Rt7fWuE09G6n_8Zpo2L8xLD5CI0L8s"};
let screen=0,ans=null,ok=false,audio=null,music=true,ctx=null,timer=null,note=0,pairPick=[];
const melody=[523.25,659.25,783.99,659.25,698.46,880,783.99,987.77,880,698.46,659.25,783.99];
function startMusic(){if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();ctx.g=ctx.createGain();ctx.g.gain.value=.13;ctx.g.connect(ctx.destination)}if(ctx.state==='suspended')ctx.resume();if(!timer){tick();timer=setInterval(tick,300)}}
function tick(){if(!music||!ctx)return;let t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.type=note%3===0?'sine':'triangle';o.frequency.value=melody[note++%melody.length];g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.045,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g);g.connect(ctx.g);o.start(t);o.stop(t+.2)}
function play(k){if(audio)audio.pause();audio=new Audio(A[k]);if(ctx)ctx.g.gain.value=.025;audio.onended=()=>{if(ctx)ctx.g.gain.value=.13};audio.play().catch(()=>{});}
function headerHtml(){return '<div class="top"><div class="badge">LỚP HỌC TÊN CỦA BÉ 🌟</div><div class="controls"><button onclick="toggleMusic()">♫</button></div></div><div class="progress"><div class="bar" style="width:'+Math.min(100,screen/9*100)+'%"></div></div>'}
function portrait(name){
 name=name.charAt(0).toUpperCase()+name.slice(1).toLowerCase();
 const p={Mai:['#ffd0ad','#3b241d','#ff7693','#ffb5c5'],Minh:['#f3bd91','#33251f','#45a6e8','#8fd3ff'],An:['#f2c29b','#5a3526','#ffc84b','#ffe18b'],Bảo:['#b97b58','#3b241c','#59b98a','#a8e3bd']}[name]||['#f0bd98','#493026','#7bc7b7','#bdeade'];
 return '<svg viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="g'+name+'" x1="0" y1="0" x2="1" y2="1"><stop stop-color="'+p[2]+'"/><stop offset="1" stop-color="'+p[3]+'"/></linearGradient></defs><circle cx="60" cy="60" r="54" fill="#fff2d9"/><path d="M20 116c4-27 20-38 40-38s36 11 40 38" fill="url(#g'+name+')"/><ellipse cx="60" cy="56" rx="31" ry="35" fill="'+p[0]+'"/><path d="M28 54c0-29 15-43 34-43 22 0 35 15 34 43-8-7-13-19-15-27-10 12-28 18-53 16z" fill="'+p[1]+'"/><path d="M31 48c-7 7-7 27 3 35-9-2-15-12-14-23 1-8 4-13 11-17zm58-3c8 6 12 18 8 30-2 6-6 10-12 12 7-12 5-27 4-42z" fill="'+p[1]+'"/><ellipse cx="48" cy="58" rx="4" ry="5" fill="#30231f"/><ellipse cx="73" cy="58" rx="4" ry="5" fill="#30231f"/><circle cx="47" cy="56" r="1.3" fill="#fff"/><circle cx="72" cy="56" r="1.3" fill="#fff"/><path d="M49 72q11 10 22 0" fill="none" stroke="#d96b62" stroke-width="3.2" stroke-linecap="round"/><circle cx="39" cy="69" r="5" fill="#f5a69e" opacity=".55"/><circle cx="81" cy="69" r="5" fill="#f5a69e" opacity=".55"/>'+((name==='Mai'||name==='An')?'<path d="M84 24l12-8 8 9-10 9z" fill="'+p[2]+'"/><circle cx="94" cy="25" r="4" fill="#fff1a6"/>':'')+'</svg>'
}
function kid(emoji,name,i,correct=false,click='chooseKid('+i+')'){let shown=name.toUpperCase(),first=shown[0],rest=shown.slice(1);return '<button class="kid '+(ans===i?(ok&&correct?'correct':'wrong'):'')+'" onclick="'+click+'"><div class="avatar">'+portrait(name)+'</div><div class="namecard"><span class="initial '+(first.toLowerCase()==='a'?'a':'')+'">'+first+'</span>'+rest+'</div></button>'}
function choices(arr,right){return '<div class="choice-row">'+arr.map((x,i)=>'<button class="choice '+(ans===i?(ok?'correct':'wrong'):'')+'" onclick="choose('+i+','+right+')">'+x+'</button>').join('')+'</div>'}
function fb(){return ok?'<div class="feedback">🌟 Chính xác! Con quan sát rất giỏi!</div><button class="next" onclick="next()">TIẾP TỤC ➜</button>':ans!==null?'<div class="feedback" style="background:#fff0f2;border-color:#ef9aaa">Thử lại một lần nữa nhé! 💗</div>':''}
function choose(i,right){ans=i;ok=i===right;if(ok){ding();setTimeout(()=>fly(typeof right==='number'&&screen===1?'M':''),80)}else retry();render()}
function chooseKid(i){const rights={2:1,3:1,4:0,6:1};ans=i;ok=i===rights[screen];if(ok){ding();if(screen===2)setTimeout(()=>fly('M'),180)}else retry();render()}
function ding(){startMusic();let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.frequency.setValueAtTime(880,t);o.frequency.setValueAtTime(1174,t+.1);g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+.35);o.connect(g);g.connect(ctx.destination);o.start();o.stop(t+.36)}
function retry(){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance('Con quan sát lại nhé!');u.lang='vi-VN';u.rate=.9;speechSynthesis.speak(u)}
function fly(ch){if(!ch)return;let d=document.createElement('div');d.className='fly-letter';d.textContent=ch;document.body.appendChild(d);setTimeout(()=>d.remove(),1200)}
function next(){ans=null;ok=false;pairPick=[];screen++;render();setTimeout(()=>play(screen===9?'finish':'t'+screen),250)}
function toggleMusic(){music=!music;startMusic();render()}
function pairSel(v){pairPick.push(v);if(pairPick.length===2){ok=(pairPick.includes('MAI')&&pairPick.includes('MINH'));ans=0;if(ok)ding();else{retry();pairPick=[]}}render()}
function balloons(){['🎈','🎈','🎈','🎉','🎈','⭐','🎈'].forEach((x,i)=>{let b=document.createElement('div');b.className='balloon';b.textContent=x;b.style.left=(8+i*14)+'%';b.style.animationDelay=(i*.25)+'s';document.body.appendChild(b)})}
function render(){let h=headerHtml();
if(screen===0)h+='<div class="scene"><div class="classroom"><div class="avatar">'+portrait('Minh')+'</div><div class="avatar">'+portrait('Mai')+'</div><div class="avatar">'+portrait('Bảo')+'</div><div class="avatar">'+portrait('An')+'</div></div><h1 class="title">TÊN CỦA BÉ VÀ CÁC BẠN</h1><div class="teacher-board">Hôm nay tên của mỗi bạn sẽ kể cho chúng mình một bí mật về chữ cái! ✨</div><p class="sub">Sẵn sàng vào lớp chưa nào?</p><button class="next" onclick="start()">VÀO LỚP HỌC 🎒</button></div>';
if(screen===1)h+='<div class="scene"><div class="question">Tên bạn <span class="target" style="font-size:1em">M</span>AI bắt đầu bằng chữ gì?</div>'+kid('','MAI',9,false,'void(0)')+choices(['M','A','I'],0)+fb()+'</div>';
if(screen===2)h+='<div class="scene"><div class="question">Bạn nào có chữ cái đầu giống <span class="target" style="font-size:1em">M</span>AI?</div><div class="cards">'+kid('','An',0,false)+kid('','Minh',1,true)+kid('','Bảo',2,false)+'</div>'+fb()+'</div>';
if(screen===3)h+='<div class="scene"><div class="question">Tên bạn nào bắt đầu bằng chữ <span class="target" style="color:#6f69c9">A</span>?</div><div class="cards">'+kid('','Bảo',0,false)+kid('','An',1,true)+kid('','Mai',2,false)+'</div>'+fb()+'</div>';
if(screen===4)h+='<div class="scene"><div class="question">Trong tên <span class="target" style="font-size:1em">M</span>INH, chữ nào đứng đầu tiên?</div>'+choices(['M','N','I'],0)+fb()+'</div>';
if(screen===5)h+='<div class="scene"><div class="question">Hai bạn nào có tên bắt đầu bằng cùng một chữ?</div><div class="cards">'+['MAI','MINH','AN'].map((n,i)=>'<button class="kid '+(pairPick.includes(n)?'correct':'')+'" onclick="pairSel(\''+n+'\')"><div class="avatar">'+portrait(n)+'</div><div class="namecard">'+n+'</div></button>').join('')+'</div>'+fb()+'</div>';
if(screen===6)h+='<div class="scene"><div class="question">Tên nào có <span class="target">3</span> chữ cái?</div><div class="cards">'+kid('','An',0,false)+kid('','Mai',1,true)+kid('','Minh',2,false)+'</div>'+fb()+'</div>';
if(screen===7)h+='<div class="scene"><div class="question">Tên con có bắt đầu bằng chữ <span class="target">M</span> không?</div><div class="groupM">NHÓM CHỮ M 🙋‍♀️🙋‍♂️</div><div class="physical">Nếu có, con hãy <b>đứng dậy</b>, nói tên của mình và bước vào “nhóm chữ M” cùng các bạn nhé!</div><button class="next" onclick="next()">CON ĐÃ THỰC HIỆN ✓</button></div>';
if(screen===8)h+='<div class="scene"><div class="question">THẺ TÊN CỦA CON Ở ĐÂU? 🔎</div><div class="teacher-board">Tìm thẻ tên thật → chỉ chữ đầu tiên → đọc tên của con hoặc của bạn.</div><div class="physical">Cô đặt các thẻ tên thật quanh lớp. Con hãy tìm một thẻ, mang về bàn và chỉ cho cô <b>chữ cái đầu tiên</b>.</div><button class="next" onclick="next()">ĐÃ TÌM THẤY THẺ TÊN ⭐</button></div>';
if(screen===9){h+='<div class="scene"><div class="stars">⭐ 🎈 ⭐ 🎈 ⭐</div><h1 class="title">CẢ LỚP TUYỆT VỜI!</h1><div class="classroom"><div class="avatar">'+portrait('Mai')+'</div><div class="avatar">'+portrait('Minh')+'</div><div class="avatar">'+portrait('An')+'</div><div class="avatar">'+portrait('Bảo')+'</div></div><div class="teacher-board">Mỗi cái tên đều thật đặc biệt. Con đã tìm được những chữ cái quen thuộc trong tên của mình và các bạn!</div><button class="next" onclick="location.reload()">CHƠI LẠI ↻</button></div>';setTimeout(balloons,300)}
document.getElementById('app').innerHTML=h}
function start(){startMusic();screen=1;render();play('t1')}render();
</script></body></html>
