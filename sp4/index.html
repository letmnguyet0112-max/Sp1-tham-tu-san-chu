function portrait(name){let display=name.charAt(0).toUpperCase()+name.slice(1).toLowerCase();let key=display.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D');let src=KIDS[key]||KIDS.Mai;return '<img src="'+src+'" alt="Bạn '+display+'" loading="eager" onerror="this.onerror=null;this.src=\''+KIDS.Mai+'\'">'}
function kid(emoji,name,i,correct=false,click='chooseKid('+i+')'){let shown=name.toUpperCase(),first=shown[0],rest=shown.slice(1);return '<button class="kid '+(ans===i?(ok&&correct?'correct':'wrong'):'')+'" onclick="'+click+'"><div class="avatar">'+portrait(name)+'</div><div class="namecard"><span class="initial '+(first.toLowerCase()==='a'?'a':'')+'">'+first+'</span>'+rest+'</div></button>'}
function choices(arr,right){return '<div class="choice-row">'+arr.map((x,i)=>'<button class="choice '+(ans===i?(ok?'correct':'wrong'):'')+'" onclick="choose('+i+','+right+')">'+x+'</button>').join('')+'</div>'}
function fb(){return ok?'<div class="feedback">🌟 Chính xác! Con quan sát rất giỏi!</div><button class="next" onclick="next()">TIẾP TỤC ➜</button>':ans!==null?'<div class="feedback" style="background:#fff0f2;border-color:#ef9aaa">Thử lại một lần nữa nhé! 💗</div>':''}
function choose(i,right){ans=i;ok=i===right;if(ok){ding();setTimeout(()=>fly(typeof right==='number'&&screen===1?'M':''),80)}else retry();render()}
function chooseKid(i){const rights={2:1,3:1,4:0,6:1};ans=i;ok=i===rights[screen];if(ok){ding();if(screen===2)setTimeout(()=>fly('M'),180)}else retry();render()}
function ding(){startMusic();let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.frequency.setValueAtTime(880,t);o.frequency.setValueAtTime(1174,t+.1);g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+.35);o.connect(g);g.connect(ctx.destination);o.start();o.stop(t+.36)}
function retry(){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance('Con quan sát lại nhé!');u.lang='vi-VN';u.rate=.9;speechSynthesis.speak(u)}
function fly(ch){if(!ch)return;let d=document.createElement('div');d.className='fly-letter';d.textContent=ch;document.body.appendChild(d);setTimeout(()=>d.remove(),1200)}
function next(){ans=null;ok=false;pairPick=[];screen++;render();setTimeout(()=>play(screen===9?'finish':'t'+screen),250)}
function toggleMusic(){music=!music;startMusic();render()}
function pairSel(v){pairPick.push(v);if(pairPick.length===2){ok=(pairPick.includes('MAI')&&pairPick.includes('MINH'));ans=0;if(ok)ding();else{retry();pairPick=[]}}render()}
function balloons(){['🎈','🎈','🎈','🎉','🎈','⭐','🎈'].forEach((x,i)=>{let b=document.createElement('div');b.className='balloon';b.textContent=x;b.style.left=(8+i*14)+'%';b.style.animationDelay=(i*.25)+'s';document.body.appendChild(b)})}
function render(){let h=headerHtml();
if(screen===0)h+='<div class="scene"><div class="classroom"><div class="introKid"><div class="avatar">'+portrait('Minh')+'</div><div class="introName">MINH</div></div><div class="introKid"><div class="avatar">'+portrait('Mai')+'</div><div class="introName">MAI</div></div><div class="introKid"><div class="avatar">'+portrait('Bảo')+'</div><div class="introName">BẢO</div></div><div class="introKid"><div class="avatar">'+portrait('An')+'</div><div class="introName">AN</div></div></div><h1 class="title">TÊN CỦA BÉ VÀ CÁC BẠN</h1><div class="teacher-board">Hôm nay tên của mỗi bạn sẽ kể cho chúng mình một bí mật về chữ cái! ✨</div><p class="sub">Sẵn sàng vào lớp chưa nào?</p><button class="next" onclick="start()">VÀO LỚP HỌC 🎒</button></div>';
if(screen===1)h+='<div class="scene"><div class="question">Tên bạn <span class="target" style="font-size:1em">M</span>AI bắt đầu bằng chữ gì?</div>'+kid('','MAI',9,false,'void(0)')+choices(['M','A','I'],0)+fb()+'</div>';
if(screen===2)h+='<div class="scene"><div class="question">Bạn nào có chữ cái đầu giống <span class="target" style="font-size:1em">M</span>AI?</div><div class="cards">'+kid('','An',0,false)+kid('','Minh',1,true)+kid('','Bảo',2,false)+'</div>'+fb()+'</div>';
if(screen===3)h+='<div class="scene"><div class="question">Tên bạn nào bắt đầu bằng chữ <span class="target" style="color:#6f69c9">A</span>?</div><div class="cards">'+kid('','Bảo',0,false)+kid('','An',1,true)+kid('','Mai',2,false)+'</div>'+fb()+'</div>';
if(screen===4)h+='<div class="scene"><div class="question">Trong tên <span class="target" style="font-size:1em">M</span>INH, chữ nào đứng đầu tiên?</div>'+choices(['M','N','I'],0)+fb()+'</div>';
if(screen===5)h+='<div class="scene"><div class="question">Hai bạn nào có tên bắt đầu bằng cùng một chữ?</div><div class="cards">'+['MAI','MINH','AN'].map((n,i)=>'<button class="kid '+(pairPick.includes(n)?'correct':'')+'" onclick="pairSel(\''+n+'\')"><div class="avatar">'+portrait(n)+'</div><div class="namecard">'+n+'</div></button>').join('')+'</div>'+fb()+'</div>';
if(screen===6)h+='<div class="scene"><div class="question">Tên nào có <span class="target">3</span> chữ cái?</div><div class="cards">'+kid('','An',0,false)+kid('','Mai',1,true)+kid('','Minh',2,false)+'</div>'+fb()+'</div>';
if(screen===7)h+='<div class="scene"><div class="question">Tên con có bắt đầu bằng chữ <span class="target">M</span> không?</div><div class="groupM">NHÓM CHỮ M 🙋‍♀️🙋‍♂️</div><div class="physical">Nếu có, con hãy <b>đứng dậy</b>, nói tên của mình và bước vào “nhóm chữ M” cùng các bạn nhé!</div><button class="next" onclick="next()">CON ĐÃ THỰC HIỆN ✓</button></div>';
if(screen===8)h+='<div class="scene"><div class="question">THẺ TÊN CỦA CON Ở ĐÂU? 🔎</div><div class="teacher-board">Tìm thẻ tên thật → chỉ chữ đầu tiên → đọc tên của con hoặc của bạn.</div><div class="physical">Cô đặt các thẻ tên thật quanh lớp. Con hãy tìm một thẻ, mang về bàn và chỉ cho cô <b>chữ cái đầu tiên</b>.</div><button class="next" onclick="next()">ĐÃ TÌM THẤY THẺ TÊN ⭐</button></div>';
if(screen===9){h+='<div class="scene"><div class="stars">⭐ 🎈 ⭐ 🎈 ⭐</div><h1 class="title">CẢ LỚP TUYỆT VỜI!</h1><div class="classroom"><div class="avatar">'+portrait('Mai')+'</div><div class="avatar">'+portrait('Minh')+'</div><div class="avatar">'+portrait('An')+'</div><div class="avatar">'+portrait('Bảo')+'</div></div><div class="teacher-board">Mỗi cái tên đều thật đặc biệt. Con đã tìm được những chữ cái quen thuộc trong tên của mình và các bạn!</div><button class="next" onclick="location.reload()">CHƠI LẠI ↻</button></div>';setTimeout(balloons,300)}
document.getElementById('app').innerHTML=h}
function start(){startMusic();screen=1;render();play('t1')}render();
</script></body></html>
